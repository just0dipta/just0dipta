<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Website — Dipta Digital Service</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* Progress Steps */
    .progress-steps { display: flex; justify-content: center; margin-bottom: 2rem; }
    .step { display: flex; align-items: center; gap: 0.5rem; }
    .step-circle { width: 36px; height: 36px; border-radius: 50%; background: var(--color-border); color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; transition: 0.3s; }
    .step.active .step-circle { background: var(--color-purple); color: white; }
    .step.completed .step-circle { background: #22c55e; color: white; }
    .step-label { font-size: 0.85rem; font-weight: 500; color: var(--color-text-secondary); }
    .step.active .step-label { color: var(--color-purple); font-weight: 600; }
    .step-line { width: 40px; height: 2px; background: var(--color-border); margin: 0 0.5rem; }
    .step.completed .step-line { background: #22c55e; }

    /* Form Container */
    .order-container { max-width: 700px; margin: 2rem auto; padding: 2rem; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-xl); }
    .form-step { display: none; }
    .form-step.active { display: block; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.4rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .btn-group { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; }
    .preview-domain { background: var(--color-purple-bg); padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 600; color: var(--color-purple); margin-top: 0.5rem; }
    .price-summary { background: var(--color-bg-secondary); padding: 1rem; border-radius: var(--radius-md); margin-top: 1rem; }
    .price-summary div { display: flex; justify-content: space-between; padding: 0.3rem 0; }
    .total-price { font-weight: 700; font-size: 1.2rem; border-top: 1px solid var(--color-border); padding-top: 0.5rem; margin-top: 0.5rem; }
    .estimate { font-size: 0.85rem; color: var(--color-text-secondary); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="order-container">
    <h2 style="text-align:center; font-weight:700; margin-bottom:2rem;">Pesan Website</h2>
    
    <!-- Progress Steps -->
    <div class="progress-steps" id="progressSteps">
      <div class="step active" id="step1Indicator">
        <span class="step-circle">1</span><span class="step-label">Paket</span>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step2Indicator">
        <span class="step-circle">2</span><span class="step-label">Domain</span>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step3Indicator">
        <span class="step-circle">3</span><span class="step-label">Detail</span>
      </div>
    </div>

    <form id="orderForm">
      <!-- Step 1: Pilih Paket -->
      <div class="form-step active" id="step1">
        <div class="form-group">
          <label>Paket Website</label>
          <select id="packageSelect" required>
            <option value="">-- Pilih Paket --</option>
            <option value="basic" data-price="200000">💠 Basic Package - Rp200.000</option>
            <option value="standard" data-price="450000">🚀 Standard Package - Rp450.000</option>
            <option value="professional" data-price="500000">👑 Professional Package - Rp500.000</option>
            <option value="school" data-price="1500000">🏫 Aplikasi Sekolah - Mulai Rp1.500.000</option>
            <option value="custom" data-price="0">⚙ Aplikasi Custom (Konsultasi)</option>
          </select>
          <div class="estimate" id="packageEstimate"></div>
        </div>
        <div class="btn-group">
          <button type="button" class="btn btn--primary" id="nextStep1">Selanjutnya →</button>
        </div>
      </div>

      <!-- Step 2: Pilih Domain -->
      <div class="form-step" id="step2">
        <div class="form-group">
          <label>Pilihan Domain (opsional)</label>
          <select id="domainSelect">
            <option value="">Tanpa domain (abaikan)</option>
            <optgroup label="Domain Indonesia">
              <option value="my.id" data-price="35000">.my.id - Rp35.000/th</option>
              <option value="web.id" data-price="50000">.web.id - Rp50.000/th</option>
              <option value="biz.id" data-price="65000">.biz.id - Rp65.000/th</option>
              <option value="sch.id" data-price="50000">.sch.id - Rp50.000/th</option>
              <option value="co.id" data-price="300000">.co.id - Rp300.000/th</option>
              <option value="id" data-price="498000">.id - Rp498.000/2th</option>
            </optgroup>
            <optgroup label="Domain Internasional">
              <option value="com" data-price="209000">.com - Rp209.000/th</option>
              <option value="net" data-price="219000">.net - Rp219.000/th</option>
              <option value="org" data-price="200000">.org - Rp200.000/th</option>
              <option value="co" data-price="649000">.co - Rp649.000/th</option>
              <option value="app" data-price="399000">.app - Rp399.000/th</option>
              <!-- Tambahkan lainnya sesuai daftar domain internasional -->
            </optgroup>
          </select>
        </div>
        <div class="form-group" id="domainNameGroup" style="display:none;">
          <label>Nama Domain (tanpa ekstensi)</label>
          <input type="text" id="domainName" placeholder="contoh: tokokue">
          <div class="preview-domain" id="domainPreview"></div>
        </div>
        <div class="btn-group">
          <button type="button" class="btn btn--ghost" id="prevStep2">← Kembali</button>
          <button type="button" class="btn btn--primary" id="nextStep2">Selanjutnya →</button>
        </div>
      </div>

      <!-- Step 3: Detail Pesanan -->
      <div class="form-step" id="step3">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
          <label>Nama Bisnis</label>
          <input type="text" id="businessName" required>
        </div>
        <div class="form-group">
          <label>Nomor WhatsApp</label>
          <input type="tel" id="whatsapp" placeholder="08xxxxx" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Jenis Bisnis</label>
          <select id="businessType" required>
            <option value="">-- Pilih --</option>
            <option value="umkm">UMKM</option>
            <option value="cafe">Cafe / Resto</option>
            <option value="sekolah">Sekolah</option>
            <option value="laundry">Laundry</option>
            <option value="toko">Toko Online</option>
            <option value="lainnya">Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label>Deskripsi Kebutuhan</label>
          <textarea id="description" placeholder="Jelaskan fitur yang diinginkan..." required></textarea>
        </div>
        <div class="form-group">
          <label>Upload Logo / Gambar Referensi</label>
          <input type="file" id="logoFile" accept="image/*">
        </div>
        <div class="form-group">
          <label>Pilihan Warna Tema</label>
          <input type="text" id="themeColor" placeholder="Contoh: Ungu & Putih">
        </div>
        <div class="form-group">
          <label>Deadline Project</label>
          <input type="date" id="deadline">
        </div>

        <!-- Ringkasan Harga -->
        <div class="price-summary" id="priceSummary">
          <div><span>Paket:</span><span id="summaryPackage">-</span></div>
          <div><span>Domain:</span><span id="summaryDomain">-</span></div>
          <div class="total-price"><span>Total:</span><span id="totalPrice">Rp0</span></div>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn--ghost" id="prevStep3">← Kembali</button>
          <button type="submit" class="btn btn--primary btn--lg" id="submitOrder">Buat Pesanan & Invoice</button>
        </div>
      </div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    const firebaseConfig = { /* Masukkan konfigurasi Anda */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    let currentStep = 1;
    let selectedPackage = null;
    let selectedDomain = null;

    // Cek login, jika belum arahkan ke login
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
    });

    // Navigasi antar step
    document.getElementById('nextStep1').addEventListener('click', () => {
      if (!document.getElementById('packageSelect').value) {
        alert('Silakan pilih paket terlebih dahulu.');
        return;
      }
      goToStep(2);
    });
    document.getElementById('nextStep2').addEventListener('click', () => {
      goToStep(3);
      updateSummary();
    });
    document.getElementById('prevStep2').addEventListener('click', () => goToStep(1));
    document.getElementById('prevStep3').addEventListener('click', () => goToStep(2));

    function goToStep(step) {
      document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
      document.getElementById('step' + step).classList.add('active');
      // Update progress indicators
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active', 'completed'));
      for (let i = 1; i <= 3; i++) {
        const indicator = document.getElementById('step' + i + 'Indicator');
        if (i < step) indicator.classList.add('completed');
        if (i === step) indicator.classList.add('active');
      }
      currentStep = step;
      if (step === 3) updateSummary();
    }

    // Domain dinamis
    const domainSelect = document.getElementById('domainSelect');
    const domainNameGroup = document.getElementById('domainNameGroup');
    domainSelect.addEventListener('change', function() {
      if (this.value) {
        domainNameGroup.style.display = 'block';
      } else {
        domainNameGroup.style.display = 'none';
        document.getElementById('domainPreview').textContent = '';
      }
      updateDomainPreview();
    });

    document.getElementById('domainName').addEventListener('input', updateDomainPreview);

    function updateDomainPreview() {
      const name = document.getElementById('domainName').value.trim();
      const ext = domainSelect.value;
      const preview = document.getElementById('domainPreview');
      if (name && ext) {
        preview.textContent = name + '.' + ext;
      } else {
        preview.textContent = '';
      }
    }

    // Estimasi paket
    document.getElementById('packageSelect').addEventListener('change', function() {
      const opt = this.options[this.selectedIndex];
      const price = opt.dataset.price;
      const estimateDiv = document.getElementById('packageEstimate');
      if (this.value === 'basic') estimateDiv.textContent = 'Estimasi pengerjaan: 1–2 hari';
      else if (this.value === 'standard') estimateDiv.textContent = 'Estimasi pengerjaan: 2–4 hari';
      else if (this.value === 'professional') estimateDiv.textContent = 'Estimasi pengerjaan: 3–7 hari';
      else estimateDiv.textContent = '';
    });

    function updateSummary() {
      const packageOpt = document.getElementById('packageSelect').selectedOptions[0];
      const domainOpt = domainSelect.selectedOptions[0];
      const packagePrice = packageOpt ? parseInt(packageOpt.dataset.price) : 0;
      const domainPrice = domainOpt ? parseInt(domainOpt.dataset.price) : 0;
      const packageName = packageOpt ? packageOpt.text.split(' -')[0] : '-';
      const domainName = domainOpt ? domainOpt.text : '-';

      document.getElementById('summaryPackage').textContent = packageName + ' (Rp' + packagePrice.toLocaleString() + ')';
      document.getElementById('summaryDomain').textContent = domainName + (domainPrice ? ' (Rp' + domainPrice.toLocaleString() + ')' : '');
      document.getElementById('totalPrice').textContent = 'Rp' + (packagePrice + domainPrice).toLocaleString();
    }

    // Submit pesanan
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const packageOpt = document.getElementById('packageSelect').selectedOptions[0];
      const domainOpt = domainSelect.selectedOptions[0];
      const packagePrice = parseInt(packageOpt.dataset.price);
      const domainPrice = domainOpt ? parseInt(domainOpt.dataset.price) : 0;
      const total = packagePrice + domainPrice;

      const orderData = {
        userId: user.uid,
        customerName: document.getElementById('fullName').value.trim(),
        businessName: document.getElementById('businessName').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        email: document.getElementById('email').value.trim(),
        businessType: document.getElementById('businessType').value,
        package: packageOpt.text.split(' -')[0],
        domainExt: domainSelect.value,
        domainName: document.getElementById('domainName').value.trim(),
        domainFull: (document.getElementById('domainName').value.trim() && domainSelect.value) ? document.getElementById('domainName').value.trim() + '.' + domainSelect.value : '',
        description: document.getElementById('description').value.trim(),
        themeColor: document.getElementById('themeColor').value.trim(),
        deadline: document.getElementById('deadline').value,
        packagePrice: packagePrice,
        domainPrice: domainPrice,
        total: total,
        status: 'pending',
        createdAt: new Date().toISOString(),
        invoiceId: 'INV-' + Date.now()
      };

      // Upload logo jika ada
      const logoFile = document.getElementById('logoFile').files[0];
      if (logoFile) {
        const logoRef = storageRef(storage, `logos/${user.uid}/${Date.now()}_${logoFile.name}`);
        await uploadBytes(logoRef, logoFile);
        const logoUrl = await getDownloadURL(logoRef);
        orderData.logoUrl = logoUrl;
      }

      // Simpan ke Firebase: invoices dan projects
      const invoiceRef = ref(db, 'invoices/' + orderData.invoiceId);
      await set(invoiceRef, {
        ...orderData,
        dueDate: new Date(Date.now() + 24*60*60*1000).toISOString() // 1 hari
      });
      
      const projectRef = ref(db, 'projects/' + user.uid + '/' + orderData.invoiceId);
      await set(projectRef, {
        package: orderData.package,
        domain: orderData.domainFull,
        status: 'menunggu pembayaran',
        progress: 0,
        createdAt: orderData.createdAt
      });

      // Redirect ke halaman invoice
      window.location.href = 'invoice.html?id=' + orderData.invoiceId;
    });
  </script>
</body>
</html>
