<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masuk — Dipta Digital Service</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-page {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--color-bg-secondary);
    }
    .auth-card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    .auth-card .brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-card .brand span {
      font-size: 2.5rem;
    }
    .auth-card h2 {
      font-weight: 700;
      font-size: 1.9rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .auth-card p {
      color: var(--color-text-secondary);
      margin-bottom: 2rem;
      font-size: 0.95rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 0.4rem;
      color: var(--color-text);
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: inherit;
      font-size: 1rem;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--color-purple);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
    }
    .btn--primary {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    .auth-footer {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      text-align: center;
      color: var(--color-text-secondary);
    }
    .auth-footer a {
      color: var(--color-purple);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--color-text-secondary);
      font-size: 0.85rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .social-btn {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--color-text);
    }
    .social-btn:hover {
      background: var(--color-bg-secondary);
    }
    .error-message {
      color: #dc2626;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand"><span>✦</span></div>
    <h2>Masuk ke Akun</h2>
    <p>Lanjutkan project website impian Anda.</p>

    <div class="error-message" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="anda@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn btn--primary">Masuk</button>
    </form>

    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Daftar sekarang</a>
    </div>

    <div class="divider">atau</div>

    <button class="social-btn" onclick="alert('Fitur Google login akan diintegrasikan.')">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Lanjutkan dengan Google
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ⚠️ Ganti dengan konfigurasi Firebase milikmu
    // firebase/firebase-config.js
    const firebaseConfig = {
      apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
      authDomain: "diptadigital-service.firebaseapp.com",
      databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "diptadigital-service",
      storageBucket: "diptadigital-service.firebasestorage.app",
      messagingSenderId: "411938166244",
      appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const errorMsg = document.getElementById('errorMsg');
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Reset error
      errorMsg.style.display = 'none';

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Ambil data user dari Realtime Database untuk cek role
        const snapshot = await get(child(ref(db), `users/${user.uid}`));
        let role = 'user';
        if (snapshot.exists()) {
          role = snapshot.val().role || 'user';
        }

        // Redirect sesuai role
        if (role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        // Tampilkan pesan error
        errorMsg.textContent = 'Login gagal: ' + (error.message.includes('auth/') ? 'Email atau password salah.' : error.message);
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
