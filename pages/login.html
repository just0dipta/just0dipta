<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Dipta Digital Service</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-page {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--color-bg-secondary);
    }
    .auth-card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 3rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .auth-card h2 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .auth-card p {
      color: var(--color-text-secondary);
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg);
      color: var(--color-text);
      font-family: inherit;
      transition: border 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--color-purple);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }
    .auth-footer {
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--color-purple);
      font-weight: 600;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card reveal-up visible">
    <span style="font-size:2rem;">✦</span>
    <h2>Masuk ke Akun</h2>
    <p>Lanjutkan project website impian Anda.</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="anda@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--primary btn--full btn--lg">Masuk</button>
    </form>
    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Daftar sekarang</a>
    </div>
    <button class="btn btn--outline btn--full mt-3" onclick="alert('Google login akan diintegrasikan dengan Firebase')">
      Lanjutkan dengan Google
    </button>
  </div>

  <script type="module">
    // Placeholder Firebase Auth integration
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    // Konfigurasi Firebase (ganti dengan milik Anda)
const firebaseConfig = {
  apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
  authDomain: "diptadigital-service.firebaseapp.com",
  databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "diptadigital-service",
  storageBucket: "diptadigital-service.firebasestorage.app",
  messagingSenderId: "411938166244",
  appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'order.html';
      } catch (error) {
        alert('Login gagal: ' + error.message);
      }
    });
  </script>
</body>
</html>
