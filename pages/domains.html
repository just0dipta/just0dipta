<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Domain — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-width: 280px;
      --color-bg: #fff; --color-bg-secondary: #f9fafb; --color-card-bg: #fff;
      --color-text: #0a0a0b; --color-text-secondary: #52525b; --color-border: #e4e4e7;
      --color-purple: #7c3aed;
    }
    [data-theme="dark"] {
      --color-bg: #0f0f11; --color-bg-secondary: #1a1a1e; --color-card-bg: #1e1e22;
      --color-text: #f1f1f3; --color-text-secondary: #a1a1aa; --color-border: #2a2a2e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background:var(--color-bg-secondary); color:var(--color-text); }
    .page-container { display:flex; min-height:100vh; }
    .sidebar { width:var(--sidebar-width); background:var(--color-card-bg); border-right:1px solid var(--color-border); padding:1.5rem; position:fixed; top:0; left:0; bottom:0; z-index:100; display:flex; flex-direction:column; transition:0.3s; }
    .sidebar__brand { font-weight:700; font-size:1.4rem; margin-bottom:2rem; display:flex; align-items:center; gap:0.5rem; }
    .sidebar__nav { flex:1; display:flex; flex-direction:column; gap:0.3rem; }
    .sidebar__link { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:0.5rem; font-weight:500; color:var(--color-text-secondary); cursor:pointer; border:none; background:transparent; text-align:left; font-size:0.95rem; transition:0.2s; }
    .sidebar__link:hover, .sidebar__link.active { background:rgba(124,58,237,0.08); color:var(--color-purple); }
    .main-content { margin-left:var(--sidebar-width); flex:1; padding:2rem; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
    .theme-toggle { background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--color-text); }
    .hamburger { display:none; background:none; border:none; font-size:1.8rem; cursor:pointer; color:var(--color-text); }
    @media (max-width:768px) {
      .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); }
      .main-content { margin-left:0; padding:1.5rem; } .hamburger { display:block; }
    }
    .domain-search { background:var(--color-card-bg); border:1px solid var(--color-border); border-radius:1rem; padding:1.5rem; margin-bottom:2rem; }
    .domain-search input { padding:0.85rem 1rem; border:1px solid var(--color-border); border-radius:0.75rem; width:100%; font-size:1.1rem; margin-bottom:1rem; background:var(--color-bg); color:var(--color-text); }
    .domain-search button { width:100%; }
    .domain-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap:1rem; margin-bottom:2rem; }
    .domain-card { background:var(--color-card-bg); border:1px solid var(--color-border); border-radius:0.75rem; padding:1rem; display:flex; justify-content:space-between; align-items:center; }
    .domain-card .price { font-weight:700; color:var(--color-purple); }
    .my-domains { margin-top:2rem; }
    .checkout-modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:200; }
    .checkout-box { background:var(--color-card-bg); border-radius:1rem; padding:2rem; max-width:500px; width:90%; max-height:90vh; overflow-y:auto; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.2rem; border-radius:0.5rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:0.2s; }
    .btn--primary { background:var(--color-purple); color:white; } .btn--ghost { background:transparent; border-color:var(--color-border); color:var(--color-text); }
    .btn--sm { padding:0.3rem 0.75rem; font-size:0.85rem; }
    .badge { padding:0.2rem 0.8rem; border-radius:100px; font-size:0.8rem; font-weight:600; }
    .badge-available { background:#d1fae5; color:#065f46; } .badge-taken { background:#fee2e2; color:#991b1b; }
    .form-group { margin-bottom:1rem; }
    .form-group label { font-weight:600; display:block; margin-bottom:0.3rem; }
    .form-group input, .form-group select { width:100%; padding:0.6rem; border:1px solid var(--color-border); border-radius:0.5rem; background:var(--color-bg); color:var(--color-text); }
    .price-summary { background:var(--color-bg-secondary); padding:1rem; border-radius:0.75rem; margin:1rem 0; }
  </style>
</head>
<body>
  <div id="loadingOverlay" style="position:fixed;inset:0;background:var(--color-bg);display:flex;align-items:center;justify-content:center;z-index:9999;">⏳</div>
  <div class="page-container" id="pageContainer" style="display:none;">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand"><span style="color:var(--color-purple);">✦</span> DiptaDigital</div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link"><i class="fas fa-home"></i> Overview</a>
        <a href="dashboard.html#websites" class="sidebar__link"><i class="fas fa-globe"></i> Website Saya</a>
        <a href="domains.html" class="sidebar__link active"><i class="fas fa-link"></i> Domain</a>
        <a href="billing.html" class="sidebar__link"><i class="fas fa-file-invoice"></i> Invoice</a>
      </nav>
      <div style="margin-top:auto; display:flex; flex-direction:column; gap:0.5rem;">
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn--ghost btn--sm" onclick="window.location.href='dashboard.html'">← Dashboard</button>
      </div>
    </aside>
    <main class="main-content">
      <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
      <div class="top-bar"><h2>Domain</h2></div>

      <!-- Search & Check -->
      <div class="domain-search">
        <h3><i class="fas fa-search"></i> Cari & Cek Domain</h3>
        <input type="text" id="domainSearchInput" placeholder="contoh: bisnisku.com">
        <button class="btn btn--primary" id="checkDomainBtn">Cek Ketersediaan</button>
        <div id="checkResult" style="margin-top:1rem;"></div>
      </div>

      <!-- Daftar Domain Global -->
      <h3>Domain Tersedia</h3>
      <div class="domain-grid" id="domainGlobalList"></div>

      <!-- Domain Saya -->
      <div class="my-domains">
        <h3>Domain Saya</h3>
        <div id="myDomainList"></div>
      </div>
    </main>
  </div>

  <!-- Checkout Modal -->
  <div class="checkout-modal" id="checkoutModal" style="display:none;">
    <div class="checkout-box" id="checkoutContent"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, push, update, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
      authDomain: "diptadigital-service.firebaseapp.com",
      databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "diptadigital-service",
      storageBucket: "diptadigital-service.firebasestorage.app",
      messagingSenderId: "411938166244",
      appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') { html.setAttribute('data-theme', 'dark'); themeToggle.innerHTML = '<i class="fas fa-sun"></i>'; }
    themeToggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('pageContainer').style.display = 'flex';
      initDomainPage(user);
    });

    function initDomainPage(user) {
      document.getElementById('hamburgerBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

      // Load global domain list
      const domainListRef = ref(db, 'domainList');
      onValue(domainListRef, (snap) => {
        const domains = snap.val() || {};
        renderGlobalDomains(domains, user);
      });

      // Load my domains
      const myDomainsRef = ref(db, `userDomains/${user.uid}`);
      onValue(myDomainsRef, (snap) => {
        const myDomains = snap.val() || {};
        renderMyDomains(myDomains);
      });

      // Check domain availability
      document.getElementById('checkDomainBtn').addEventListener('click', async () => {
        const domain = document.getElementById('domainSearchInput').value.trim().toLowerCase();
        if (!domain) return;
        // Cek di database domainList dan userDomains (semua user)
        const checkRef = ref(db, 'domainList/' + domain.replace(/\./g, '_'));
        const snap = await get(checkRef);
        const resultDiv = document.getElementById('checkResult');
        if (snap.exists()) {
          const data = snap.val();
          resultDiv.innerHTML = `<span class="badge badge-${data.available ? 'available' : 'taken'}">${data.available ? '✅ Tersedia' : '❌ Sudah dipakai'}</span>`;
          if (data.available) {
            resultDiv.innerHTML += `<button class="btn btn--primary btn--sm" style="margin-left:1rem;" id="buyDomainBtn" data-domain="${domain}" data-price="${data.price}">Beli Sekarang</button>`;
            document.getElementById('buyDomainBtn').addEventListener('click', () => openCheckout(domain, data.price, user));
          }
        } else {
          // Cek di userDomains global? sederhana: anggap tersedia
          resultDiv.innerHTML = `<span class="badge badge-available">✅ Tersedia</span>`;
          resultDiv.innerHTML += `<button class="btn btn--primary btn--sm" style="margin-left:1rem;" id="buyDomainBtn" data-domain="${domain}" data-price="150000">Beli (Rp150rb)</button>`;
          document.getElementById('buyDomainBtn').addEventListener('click', () => openCheckout(domain, 150000, user));
        }
      });
    }

    function renderGlobalDomains(domains, user) {
      let html = '';
      for (let id in domains) {
        const d = domains[id];
        html += `<div class="domain-card">
          <div><strong>${d.name}</strong><br><span class="price">Rp ${d.price?.toLocaleString() || '-'}/th</span></div>
          <button class="btn btn--primary btn--sm buy-global" data-domain="${d.name}" data-price="${d.price}">Beli</button>
        </div>`;
      }
      document.getElementById('domainGlobalList').innerHTML = html || '<p>Tidak ada domain tersedia saat ini.</p>';
      document.querySelectorAll('.buy-global').forEach(btn => {
        btn.addEventListener('click', () => openCheckout(btn.dataset.domain, parseInt(btn.dataset.price), user));
      });
    }

    function renderMyDomains(myDomains) {
      let html = '';
      for (let id in myDomains) {
        const d = myDomains[id];
        html += `<div class="domain-card">
          <div><strong>${d.name}</strong><br>Exp: ${d.expiry ? new Date(d.expiry).toLocaleDateString() : '-'}</div>
          <span class="badge badge-available">Aktif</span>
        </div>`;
      }
      document.getElementById('myDomainList').innerHTML = html || '<p>Belum memiliki domain.</p>';
    }

    function openCheckout(domain, price, user) {
      const modal = document.getElementById('checkoutModal');
      const content = document.getElementById('checkoutContent');
      content.innerHTML = `
        <h3>Checkout Domain</h3>
        <p><strong>Domain:</strong> ${domain}</p>
        <p><strong>Harga Dasar:</strong> Rp ${price.toLocaleString()}/tahun</p>
        <div class="form-group">
          <label><input type="checkbox" id="maintenanceOpt" checked> 🛠️ Monthly Maintenance (Rp30.000/tahun)</label>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="asuransiOpt"> 🔒 Asuransi Kepemilikan (Rp10.000)</label>
        </div>
        <div class="form-group"><label>Biaya Admin</label> <strong>Rp 5.000</strong></div>
        <div class="price-summary" id="checkoutTotal"></div>
        <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top:1rem;">
          <button class="btn btn--ghost" id="cancelCheckout">Batal</button>
          <button class="btn btn--primary" id="confirmCheckout">Beli Domain</button>
        </div>
      `;
      modal.style.display = 'flex';

      const maintenanceCheck = document.getElementById('maintenanceOpt');
      const asuransiCheck = document.getElementById('asuransiOpt');
      const totalDiv = document.getElementById('checkoutTotal');

      function updateTotal() {
        const maintenance = maintenanceCheck.checked ? 30000 : 0;
        const asuransi = asuransiCheck.checked ? 10000 : 0;
        const admin = 5000;
        const total = price + maintenance + asuransi + admin;
        totalDiv.innerHTML = `
          <div style="display:flex; justify-content:space-between;"><span>Domain (1 tahun)</span><span>Rp ${price.toLocaleString()}</span></div>
          ${maintenance ? `<div style="display:flex; justify-content:space-between;"><span>Maintenance</span><span>Rp 30.000</span></div>` : ''}
          ${asuransi ? `<div style="display:flex; justify-content:space-between;"><span>Asuransi</span><span>Rp 10.000</span></div>` : ''}
          <div style="display:flex; justify-content:space-between;"><span>Biaya Admin</span><span>Rp 5.000</span></div>
          <hr>
          <div style="display:flex; justify-content:space-between; font-weight:700;"><span>Total (100%)</span><span>Rp ${total.toLocaleString()}</span></div>
        `;
      }
      maintenanceCheck.addEventListener('change', updateTotal);
      asuransiCheck.addEventListener('change', updateTotal);
      updateTotal();

      document.getElementById('cancelCheckout').addEventListener('click', () => modal.style.display = 'none');
      document.getElementById('confirmCheckout').addEventListener('click', async () => {
        const maintenance = maintenanceCheck.checked;
        const asuransi = asuransiCheck.checked;
        const admin = 5000;
        const total = price + (maintenance ? 30000 : 0) + (asuransi ? 10000 : 0) + admin;
        const invoiceId = 'INV-DOM-' + Date.now();
        const expiry = new Date();
        expiry.setFullYear(expiry.getFullYear() + 1);

        const orderData = {
          userId: user.uid,
          type: 'domain',
          domain: domain,
          price: price,
          maintenance: maintenance,
          asuransi: asuransi,
          adminFee: admin,
          total: total,
          status: 'pending',
          createdAt: new Date().toISOString(),
          dueDate: new Date(Date.now() + 24*60*60*1000).toISOString(),
          invoiceId: invoiceId,
          expiry: expiry.toISOString()
        };

        try {
          await set(ref(db, 'invoices/' + invoiceId), orderData);
          await set(ref(db, `userDomains/${user.uid}/${domain.replace(/\./g, '_')}`), {
            name: domain,
            price: price,
            expiry: expiry.toISOString(),
            maintenance: maintenance,
            asuransi: asuransi,
            invoiceId: invoiceId,
            status: 'pending'
          });
          modal.style.display = 'none';
          window.location.href = 'invoice.html?id=' + invoiceId;
        } catch (err) {
          alert('Gagal membuat pesanan: ' + err.message);
        }
      });

      modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    }
  </script>
</body>
</html>
