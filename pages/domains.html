<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Saya — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content">
      <h2>🔗 Domain Saya</h2>
      <div id="domainList"></div>
    </main>
  </div>
  <script type="module">
    import { initSidebar } from '../components/sidebar.js';
    initSidebar('sidebarContainer', [
      { label: 'Overview', href: 'dashboard.html' },
      { label: 'Website Saya', href: 'websites.html' },
      { label: 'Domain', href: 'domains.html', active: true },
      { label: 'Invoice', href: 'billing.html' },
      { label: 'Konsultasi', href: 'consultation.html' },
      { label: 'Profil', href: 'profile.html' },
    ]);
    // Firebase fetch domains user
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    const auth = getAuth(); const db = getDatabase();
    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = 'login.html';
      const domRef = ref(db, `domains/${user.uid}`);
      onValue(domRef, snap => {
        const domains = snap.val();
        const list = document.getElementById('domainList');
        if (!domains) { list.innerHTML = '<p>Tidak ada domain terdaftar.</p>'; return; }
        list.innerHTML = Object.values(domains).map(d => `<div class="domain-item"><span>${d.name}</span><span>Exp: ${d.expiry}</span></div>`).join('');
      });
    });
  </script>
</body>
</html>
