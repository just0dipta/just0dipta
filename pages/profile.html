<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .profile-container { max-width: 600px; margin: 2rem auto; padding: 2rem; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-xl); }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--color-purple); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { font-weight: 600; display: block; margin-bottom: 0.25rem; }
    .form-group input { width: 100%; padding: 0.6rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
  </style>
</head>
<body>
  <div class="profile-container">
    <div class="profile-avatar" id="profileAvatar">U</div>
    <h2 style="text-align:center;">Profil Saya</h2>
    <form id="profileForm">
      <div class="form-group"><label>Nama</label><input type="text" id="displayName" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" disabled></div>
      <div class="form-group"><label>Upload Foto</label><input type="file" id="photoInput"></div>
      <button type="submit" class="btn btn--primary btn--full">Simpan Perubahan</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
    import { getDatabase, ref as dbRef, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { /* ... */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const storage = getStorage(app);
    const db = getDatabase(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
      document.getElementById('displayName').value = user.displayName || '';
      document.getElementById('email').value = user.email;
      document.getElementById('profileAvatar').textContent = (user.displayName || 'U')[0];
    });

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      const newName = document.getElementById('displayName').value;
      const file = document.getElementById('photoInput').files[0];
      
      if (newName) await updateProfile(user, { displayName: newName });
      if (file) {
        const storageRef = ref(storage, `avatars/${user.uid}`);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        await updateProfile(user, { photoURL: url });
        await update(dbRef(db, `users/${user.uid}`), { photoURL: url });
      }
      await update(dbRef(db, `users/${user.uid}`), { name: newName });
      alert('Profil diperbarui!');
    });
  </script>
</body>
</html>
