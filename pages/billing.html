<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice & Tagihan — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebarContainer"></aside>
    <main class="main-content">
      <h2>💳 Invoice & Tagihan</h2>
      <div id="invoiceList"></div>
    </main>
  </div>
  <script type="module">
    import { initSidebar } from '../components/sidebar.js';
    initSidebar('sidebarContainer', [
      { label: 'Overview', href: 'dashboard.html' },
      { label: 'Website', href: 'websites.html' },
      { label: 'Domain', href: 'domains.html' },
      { label: 'Invoice', href: 'billing.html', active: true },
      { label: 'Konsultasi', href: 'consultation.html' },
      { label: 'Profil', href: 'profile.html' },
    ]);
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    const auth = getAuth(); const db = getDatabase();
    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = 'login.html';
      const invRef = ref(db, 'invoices');
      onValue(invRef, snap => {
        const invs = snap.val();
        const userInvs = invs ? Object.entries(invs).filter(([k,v]) => v.userId === user.uid) : [];
        document.getElementById('invoiceList').innerHTML = userInvs.length ? userInvs.map(([id, inv]) => `
          <div class="project-item"><div><strong>#${id}</strong> - ${inv.package}</div><span>Rp${inv.amount}</span><a href="invoice.html?id=${id}" class="btn btn--sm btn--ghost">Lihat</a></div>
        `).join('') : '<p>Tidak ada tagihan.</p>';
      });
    });
  </script>
</body>
</html>
