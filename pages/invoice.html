<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invoice — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .invoice-container { max-width: 800px; margin: 2rem auto; padding: 2rem; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-xl); }
    .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .invoice-logo { font-weight: 700; font-size: 1.8rem; }
    .status-badge { padding: 0.4rem 1.2rem; border-radius: 100px; font-weight: 600; font-size: 0.9rem; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-verification { background: #dbeafe; color: #1e40af; }
    .status-paid { background: #d1fae5; color: #065f46; }
    .status-expired { background: #fee2e2; color: #991b1b; }
    .invoice-details { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
    .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
    .invoice-table th, .invoice-table td { padding: 0.75rem; border-bottom: 1px solid var(--color-border); text-align: left; }
    .invoice-table th { background: var(--color-bg-secondary); font-weight: 600; }
    .payment-section { background: var(--color-bg-secondary); border-radius: var(--radius-lg); padding: 1.5rem; margin: 2rem 0; }
    .qris-img { max-width: 200px; margin: 1rem auto; display: block; border-radius: var(--radius-md); }
    .gopay-info { background: #00AA13; color: white; padding: 0.8rem 1rem; border-radius: var(--radius-md); text-align: center; font-weight: 600; margin-top: 1rem; }
    .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .popup-box { background: var(--color-card-bg); border-radius: var(--radius-xl); padding: 2rem; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .popup-box h3 { margin-bottom: 1rem; }
    .popup-box .btn { margin: 0.5rem; }
  </style>
</head>
<body>
  <div class="invoice-container" id="invoiceContent">
    <div style="text-align:center; padding:2rem;">Memuat invoice...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
      authDomain: "diptadigital-service.firebaseapp.com",
      databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "diptadigital-service",
      storageBucket: "diptadigital-service.firebasestorage.app",
      messagingSenderId: "411938166244",
      appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const invoiceId = urlParams.get('id');
    if (!invoiceId) {
      document.getElementById('invoiceContent').innerHTML = '<p style="text-align:center;">ID invoice tidak ditemukan.</p>';
      throw new Error('Missing invoice ID');
    }

    async function loadInvoice() {
      try {
        const snap = await get(child(ref(db), `invoices/${invoiceId}`));
        if (!snap.exists()) {
          document.getElementById('invoiceContent').innerHTML = '<p style="text-align:center;">Invoice tidak ditemukan.</p>';
          return;
        }
        renderInvoice(snap.val());
      } catch (err) {
        document.getElementById('invoiceContent').innerHTML = '<p style="text-align:center;">Gagal memuat data.</p>';
      }
    }

    function renderInvoice(inv) {
      const status = inv.status || 'pending';
      // Tampilan status: jika paid, tampilkan "Lunas - Waiting for Dev"
      let statusText, statusClass;
      if (status === 'dp_pending') {
        statusText = 'Menunggu DP';
        statusClass = 'status-pending';
      } else if (status === 'menunggu verifikasi') {
        statusText = 'Menunggu Verifikasi';
        statusClass = 'status-verification';
      } else if (status === 'paid') {
        statusText = 'Lunas - Waiting for Developer';
        statusClass = 'status-paid';
      } else if (status === 'expired') {
        statusText = 'Kadaluarsa';
        statusClass = 'status-expired';
      } else {
        statusText = status;
        statusClass = 'status-pending';
      }

      const total = inv.total || 0;
      const dp = inv.dpAmount || 0;
      const remaining = inv.remaining || (total - dp);
      const showPayment = (status === 'dp_pending');

      const html = `
        <div class="invoice-header">
          <div>
            <div class="invoice-logo">✦ Dipta Digital</div>
            <p style="color:var(--color-text-secondary);">Invoice #${invoiceId}</p>
          </div>
          <div><span class="status-badge ${statusClass}">${statusText}</span></div>
        </div>

        <div class="invoice-details">
          <div>
            <strong>Kepada:</strong><br>
            ${inv.customerName || '-'}<br>
            ${inv.email || '-'}<br>
            ${inv.whatsapp || '-'}
          </div>
          <div>
            <strong>Tanggal:</strong> ${new Date(inv.createdAt).toLocaleDateString()}<br>
            ${inv.domainExpiry ? `<strong>Renewal Domain:</strong> ${new Date(inv.domainExpiry).toLocaleDateString()}` : ''}
          </div>
        </div>

        <table class="invoice-table">
          <thead><tr><th>Deskripsi</th><th>Harga</th></tr></thead>
          <tbody>
            <tr><td>${inv.package} Website</td><td>Rp ${(total - (inv.domainPrice || 0) - (inv.noDomainFee || 0) - (inv.maintenance ? 30000 : 0)).toLocaleString()}</td></tr>
            ${inv.domainFull ? `<tr><td>Domain ${inv.domainFull}</td><td>Rp ${(inv.domainPrice || 0).toLocaleString()}</td></tr>` : ''}
            ${inv.noDomainFee ? `<tr><td>Tanpa Domain</td><td>Rp ${inv.noDomainFee.toLocaleString()}</td></tr>` : ''}
            ${inv.maintenance ? `<tr><td>Maintenance Domain (tahunan)</td><td>Rp 30.000</td></tr>` : ''}
            <tr><td>Biaya Admin</td><td>Rp ${(inv.adminFee || 5000).toLocaleString()}</td></tr>
            <tr><td colspan="2" style="text-align:right; font-weight:700;">Total: Rp ${total.toLocaleString()}</td></tr>
            <tr><td colspan="2" style="text-align:right; color:var(--color-purple); font-weight:600;">
              DP yang harus dibayar sekarang (50%): Rp ${dp.toLocaleString()}
            </td></tr>
            <tr><td colspan="2" style="text-align:right;">Sisa pelunasan: Rp ${remaining.toLocaleString()}</td></tr>
          </tbody>
        </table>

        ${showPayment ? `
        <div class="payment-section" id="paymentSection">
          <h3>Metode Pembayaran DP</h3>
          <div style="text-align:center;">
            <img src="../assets/images/qris.jpg" alt="QRIS" class="qris-img" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23f0f0f0%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22>QRIS</text></svg>'">
            <p style="margin-top:0.5rem;">Scan QRIS di atas atau transfer ke:</p>
          </div>
          <div class="gopay-info">
            GOPAY: 082169797528<br>
            <small>a.n. Dipta Digital Service</small>
          </div>
          <div style="text-align:center; margin-top:1.5rem;">
            <button class="btn btn--primary" id="markAsPaidBtn">Saya Sudah Bayar</button>
          </div>
        </div>
        ` : ''}

        ${status === 'menunggu verifikasi' ? `
        <div style="text-align:center; font-size:1.1rem; color:var(--color-purple); font-weight:600; margin:2rem 0;">
          ⏳ Menunggu verifikasi dari admin. Status akan diperbarui setelah pembayaran dikonfirmasi.
        </div>` : ''}

        ${status === 'paid' ? `
        <div style="text-align:center; font-size:1.1rem; color:#065f46; font-weight:600; margin:2rem 0;">
          ✅ Pembayaran lunas. Website Anda sedang dalam antrian pengerjaan oleh tim developer.
        </div>` : ''}

        <div class="btn-group">
          <button class="btn btn--outline" onclick="window.print()">Cetak PDF</button>
          <button class="btn btn--ghost" onclick="navigator.clipboard.writeText('${invoiceId}')">Salin Kode Invoice</button>
        </div>
      `;

      document.getElementById('invoiceContent').innerHTML = html;

      if (showPayment) {
        document.getElementById('markAsPaidBtn').addEventListener('click', () => showConfirmationPopup());
      }
    }

    function showConfirmationPopup() {
      const overlay = document.createElement('div');
      overlay.className = 'popup-overlay';
      overlay.innerHTML = `
        <div class="popup-box">
          <h3>Konfirmasi Pembayaran</h3>
          <p>Apakah Anda yakin sudah melakukan pembayaran DP?</p>
          <p style="font-size:0.9rem; color:var(--color-text-secondary);">Status invoice akan berubah menjadi "Menunggu Verifikasi".</p>
          <div>
            <button class="btn btn--primary" id="confirmYes">Ya, Saya Sudah Bayar</button>
            <button class="btn btn--ghost" id="confirmNo">Batal</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('confirmYes').addEventListener('click', async () => {
        try {
          await update(ref(db, `invoices/${invoiceId}`), { status: 'menunggu verifikasi' });
          overlay.remove();
          window.location.reload();
        } catch (err) {
          alert('Gagal memperbarui status: ' + err.message);
          overlay.remove();
        }
      });

      document.getElementById('confirmNo').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    loadInvoice();
  </script>
</body>
</html>
