<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice #INV-001 — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .invoice-page { max-width: 800px; margin: 2rem auto; padding: 2rem; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-xl); }
    .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
    .invoice-logo { font-weight: 700; font-size: 1.5rem; }
    .invoice-status { display: inline-block; padding: 0.25rem 1rem; border-radius: 100px; font-weight: 600; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-paid { background: #d1fae5; color: #065f46; }
    .invoice-details { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
    .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
    .invoice-table th, .invoice-table td { padding: 0.75rem; border-bottom: 1px solid var(--color-border); text-align: left; }
    .qris-section { text-align: center; margin: 2rem 0; }
    .qris-img { max-width: 200px; margin: 0 auto; }
    .countdown { font-weight: 700; color: var(--color-purple); margin: 1rem 0; }
  </style>
</head>
<body>
  <div class="invoice-page" id="invoicePage">
    <!-- Data akan diisi oleh JavaScript -->
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    
    const firebaseConfig = { /* konfigurasi */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Ambil invoice ID dari URL (?id=INV123)
    const urlParams = new URLSearchParams(window.location.search);
    const invoiceId = urlParams.get('id') || 'INV-001';

    async function loadInvoice() {
      const snap = await get(child(ref(db), `invoices/${invoiceId}`));
      if (!snap.exists()) {
        document.getElementById('invoicePage').innerHTML = '<p>Invoice tidak ditemukan.</p>';
        return;
      }
      const inv = snap.val();
      document.getElementById('invoicePage').innerHTML = `
        <div class="invoice-header">
          <div>
            <div class="invoice-logo">✦ Dipta Digital</div>
            <p style="color:var(--color-text-secondary);">Invoice #${invoiceId}</p>
          </div>
          <div>
            <span class="invoice-status ${inv.status === 'paid' ? 'status-paid' : 'status-pending'}">${inv.status.toUpperCase()}</span>
          </div>
        </div>
        <div class="invoice-details">
          <div>
            <strong>Kepada:</strong><br>
            ${inv.customerName}<br>
            ${inv.email}<br>
            ${inv.phone}
          </div>
          <div>
            <strong>Tanggal:</strong> ${new Date(inv.createdAt).toLocaleDateString()}<br>
            <strong>Jatuh Tempo:</strong> ${new Date(inv.dueDate).toLocaleDateString()}
          </div>
        </div>
        <table class="invoice-table">
          <thead><tr><th>Deskripsi</th><th>Harga</th></tr></thead>
          <tbody>
            <tr><td>${inv.package} Website</td><td>Rp ${inv.amount.toLocaleString()}</td></tr>
            <tr><td>Domain (${inv.domain})</td><td>Rp ${inv.domainPrice.toLocaleString()}</td></tr>
            <tr><td colspan="2" style="text-align:right; font-weight:700;">Total: Rp ${(inv.amount + inv.domainPrice).toLocaleString()}</td></tr>
          </tbody>
        </table>
        ${inv.status === 'pending' ? `
        <div class="qris-section">
          <h3>Pembayaran via QRIS</h3>
          <img src="../assets/images/qris.jpg" alt="QRIS" class="qris-img">
          <p>Total: Rp ${(inv.amount + inv.domainPrice).toLocaleString()}</p>
          <div class="countdown" id="countdown">Sisa waktu: ...</div>
          <button class="btn btn--primary" id="markAsPaid">Saya Sudah Bayar</button>
        </div>` : ''}
        <div style="display:flex; gap:1rem; margin-top:1.5rem;">
          <button class="btn btn--outline" onclick="window.print()">Cetak PDF</button>
          <button class="btn btn--ghost" onclick="navigator.clipboard.writeText('INV-${invoiceId}')">Salin Kode Invoice</button>
        </div>
      `;

      if (inv.status === 'pending') {
        // Countdown sederhana
        const due = new Date(inv.dueDate).getTime();
        const timer = setInterval(() => {
          const now = Date.now();
          const diff = due - now;
          if (diff <= 0) {
            clearInterval(timer);
            document.getElementById('countdown').textContent = 'Waktu pembayaran habis';
          } else {
            const hours = Math.floor(diff / (1000*60*60));
            const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
            document.getElementById('countdown').textContent = `Sisa waktu: ${hours}j ${mins}m`;
          }
        }, 60000);

        document.getElementById('markAsPaid').addEventListener('click', async () => {
          await update(ref(db, `invoices/${invoiceId}`), { status: 'menunggu verifikasi' });
          window.location.reload();
        });
      }
    }

    loadInvoice();
  </script>
</body>
</html>
