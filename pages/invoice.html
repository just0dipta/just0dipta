<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .invoice-page { max-width: 800px; margin: 2rem auto; padding: 2rem; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-xl); }
    .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .invoice-logo { font-weight: 700; font-size: 1.5rem; }
    .invoice-status { padding: 0.25rem 1rem; border-radius: 100px; font-weight: 600; display: inline-block; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-waiting { background: #dbeafe; color: #1e40af; }
    .status-paid { background: #d1fae5; color: #065f46; }
    .status-expired { background: #fee2e2; color: #991b1b; }
    .invoice-details { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
    .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
    .invoice-table th, .invoice-table td { padding: 0.75rem; border-bottom: 1px solid var(--color-border); text-align: left; }
    .invoice-table th { background: var(--color-bg-secondary); font-weight: 600; }
    .qris-section { text-align: center; margin: 2rem 0; background: var(--color-bg-secondary); padding: 1.5rem; border-radius: var(--radius-lg); }
    .qris-img { max-width: 200px; margin: 0 auto; display: block; }
    .countdown { font-weight: 700; color: var(--color-purple); margin: 1rem 0; font-size: 1.1rem; }
    .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .loading { text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <div class="invoice-page" id="invoicePage">
    <div class="loading">Memuat invoice...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // ⚠️ Ganti dengan konfigurasi Anda
const firebaseConfig = {
  apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
  authDomain: "diptadigital-service.firebaseapp.com",
  databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "diptadigital-service",
  storageBucket: "diptadigital-service.firebasestorage.app",
  messagingSenderId: "411938166244",
  appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
};

    let app, db, auth;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      auth = getAuth(app);
    } catch (e) {
      console.error('Firebase config error:', e);
      // Fallback: tampilkan data dummy jika Firebase belum diatur
      renderFallbackInvoice();
    }

    // Ambil ID dari URL (?id=INV-xxx)
    const urlParams = new URLSearchParams(window.location.search);
    const invoiceId = urlParams.get('id');

    if (!invoiceId) {
      document.getElementById('invoicePage').innerHTML = '<p>ID invoice tidak ditemukan di URL.</p>';
      throw new Error('Missing invoice ID');
    }

    // Fungsi untuk mengambil data invoice
    async function loadInvoice() {
      if (!db) {
        renderFallbackInvoice();
        return;
      }

      try {
        const snapshot = await get(child(ref(db), `invoices/${invoiceId}`));
        if (!snapshot.exists()) {
          document.getElementById('invoicePage').innerHTML = '<p>Invoice tidak ditemukan.</p>';
          return;
        }
        const inv = snapshot.val();
        renderInvoice(inv);
      } catch (error) {
        console.error('Gagal mengambil invoice:', error);
        document.getElementById('invoicePage').innerHTML = '<p>Gagal memuat invoice. Periksa koneksi Anda.</p>';
      }
    }

    // Render data invoice ke HTML
    function renderInvoice(inv) {
      const statusClass = 
        inv.status === 'pending' ? 'status-pending' :
        inv.status === 'menunggu verifikasi' ? 'status-waiting' :
        inv.status === 'paid' ? 'status-paid' :
        inv.status === 'expired' ? 'status-expired' : 'status-pending';

      const total = (inv.packagePrice || 0) + (inv.domainPrice || 0);

      document.getElementById('invoicePage').innerHTML = `
        <div class="invoice-header">
          <div>
            <div class="invoice-logo">✦ Dipta Digital</div>
            <p style="color:var(--color-text-secondary);">Invoice #${invoiceId}</p>
          </div>
          <div>
            <span class="invoice-status ${statusClass}">${inv.status.toUpperCase()}</span>
          </div>
        </div>

        <div class="invoice-details">
          <div>
            <strong>Kepada:</strong><br>
            ${inv.customerName || '-'}<br>
            ${inv.email || '-'}<br>
            ${inv.whatsapp || '-'}
          </div>
          <div>
            <strong>Tanggal:</strong> ${new Date(inv.createdAt).toLocaleDateString()}<br>
            <strong>Jatuh Tempo:</strong> ${new Date(inv.dueDate).toLocaleDateString()}
          </div>
        </div>

        <table class="invoice-table">
          <thead><tr><th>Deskripsi</th><th>Harga</th></tr></thead>
          <tbody>
            <tr><td>${inv.package || '-'} Website</td><td>Rp ${(inv.packagePrice || 0).toLocaleString()}</td></tr>
            ${inv.domainFull ? `<tr><td>Domain (${inv.domainFull})</td><td>Rp ${(inv.domainPrice || 0).toLocaleString()}</td></tr>` : ''}
            <tr><td colspan="2" style="text-align:right; font-weight:700;">Total: Rp ${total.toLocaleString()}</td></tr>
          </tbody>
        </table>

        ${inv.status === 'pending' ? `
        <div class="qris-section">
          <h3>Pembayaran via QRIS</h3>
          <img src="../assets/images/qris.jpg" alt="QRIS" class="qris-img" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23f0f0f0%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2216%22>QRIS</text></svg>'">
          <p>Total: <strong>Rp ${total.toLocaleString()}</strong></p>
          <div class="countdown" id="countdown">Menghitung sisa waktu...</div>
          <button class="btn btn--primary" id="markAsPaid">Saya Sudah Bayar</button>
        </div>` : ''}

        <div class="btn-group">
          <button class="btn btn--outline" onclick="window.print()">Cetak PDF</button>
          <button class="btn btn--ghost" onclick="navigator.clipboard.writeText('${invoiceId}')">Salin Kode Invoice</button>
          <button class="btn btn--ghost" onclick="navigator.clipboard.writeText('${total}')">Salin Nominal</button>
        </div>
      `;

      // Hitung mundur & tombol "Saya Sudah Bayar"
      if (inv.status === 'pending' && inv.dueDate) {
        const dueTime = new Date(inv.dueDate).getTime();
        const timer = setInterval(() => {
          const now = Date.now();
          const diff = dueTime - now;
          const el = document.getElementById('countdown');
          if (!el) { clearInterval(timer); return; }
          if (diff <= 0) {
            el.textContent = 'Waktu pembayaran habis';
            clearInterval(timer);
            // Auto update status expired (opsional)
            if (db) update(ref(db, `invoices/${invoiceId}`), { status: 'expired' });
          } else {
            const h = Math.floor(diff / (1000*60*60));
            const m = Math.floor((diff % (1000*60*60)) / (1000*60));
            const s = Math.floor((diff % (1000*60)) / 1000);
            el.textContent = `Sisa waktu: ${h}j ${m}m ${s}d`;
          }
        }, 1000);

        document.getElementById('markAsPaid').addEventListener('click', async () => {
          if (!db) {
            alert('Firebase belum dikonfigurasi. Status tidak dapat diperbarui.');
            return;
          }
          try {
            await update(ref(db, `invoices/${invoiceId}`), { status: 'menunggu verifikasi' });
            alert('Terima kasih! Status berubah menjadi "Menunggu Verifikasi".');
            window.location.reload();
          } catch (error) {
            alert('Gagal memperbarui status.');
          }
        });
      }
    }

    // Fallback untuk testing tanpa Firebase
    function renderFallbackInvoice() {
      const dummyInv = {
        status: 'pending',
        customerName: 'Nama Pelanggan',
        email: 'email@contoh.com',
        whatsapp: '08123456789',
        package: 'Standard Package',
        domainFull: 'tokokue.com',
        packagePrice: 450000,
        domainPrice: 209000,
        total: 659000,
        createdAt: new Date().toISOString(),
        dueDate: new Date(Date.now() + 24*60*60*1000).toISOString(),
        invoiceId: invoiceId || 'INV-DUMMY'
      };
      renderInvoice(dummyInv);
    }

    // Jalankan
    loadInvoice();
  </script>
</body>
</html>
