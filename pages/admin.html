<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 260px; background: var(--color-card-bg); border-right: 1px solid var(--color-border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .admin-sidebar__logo { font-weight: 700; font-size: 1.2rem; }
    .admin-sidebar__nav { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
    .admin-sidebar__link { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: var(--radius-md); font-weight: 500; color: var(--color-text-secondary); cursor: pointer; }
    .admin-sidebar__link:hover, .admin-sidebar__link.active { background: var(--color-purple-bg); color: var(--color-purple); }
    .admin-content { flex: 1; padding: 2rem; background: var(--color-bg-secondary); overflow-y: auto; }
    .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .admin-card { background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.5rem; }
    .admin-card__label { color: var(--color-text-secondary); font-size: 0.85rem; }
    .admin-card__value { font-size: 2rem; font-weight: 700; }
    .data-table { width: 100%; background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
    .data-table th, .data-table td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--color-border); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar__logo">✦ Dipta Admin</div>
      <nav class="admin-sidebar__nav">
        <a href="#overview" class="admin-sidebar__link active" data-section="overview">📊 Overview</a>
        <a href="#users" class="admin-sidebar__link" data-section="users">👥 Users</a>
        <a href="#payments" class="admin-sidebar__link" data-section="payments">💳 Pembayaran</a>
        <a href="#invoices" class="admin-sidebar__link" data-section="invoices">📄 Invoice</a>
      </nav>
      <button class="btn btn--ghost" id="logoutAdmin">Keluar</button>
    </aside>
    <main class="admin-content" id="adminContent"></main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { /* isi */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      const snap = await get(child(ref(db), `users/${user.uid}`));
      const userData = snap.val();
      if (!userData || userData.role !== 'admin') {
        alert('Akses ditolak.');
        signOut(auth);
        return;
      }
      // Load default section
      loadSection('overview');
    });

    document.getElementById('logoutAdmin').addEventListener('click', () => signOut(auth).then(() => window.location.href = '../index.html'));

    document.querySelectorAll('.admin-sidebar__link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.admin-sidebar__link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        loadSection(link.dataset.section);
      });
    });

    function loadSection(section) {
      const content = document.getElementById('adminContent');
      switch(section) {
        case 'overview': loadOverview(content); break;
        case 'users': loadUsers(content); break;
        case 'payments': loadPayments(content); break;
        case 'invoices': loadInvoices(content); break;
      }
    }

    function loadOverview(container) {
      container.innerHTML = `<div class="dashboard-cards"><div class="admin-card"><div class="admin-card__label">Total User</div><div class="admin-card__value" id="totalUsers">-</div></div></div>`;
      onValue(ref(db, 'users'), snap => {
        document.getElementById('totalUsers').textContent = snap.size;
      });
    }
    function loadUsers(container) {
      container.innerHTML = `<h2>Manajemen User</h2><div id="userTable"></div>`;
      onValue(ref(db, 'users'), snap => {
        const users = snap.val();
        let html = '<table class="data-table"><tr><th>Nama</th><th>Email</th><th>Role</th></tr>';
        for (let id in users) html += `<tr><td>${users[id].name}</td><td>${users[id].email}</td><td>${users[id].role||'user'}</td></tr>`;
        document.getElementById('userTable').innerHTML = html + '</table>';
      });
    }
    function loadPayments(container) {
      container.innerHTML = `<h2>Verifikasi Pembayaran</h2><div id="paymentList"></div>`;
      onValue(ref(db, 'invoices'), snap => {
        const invs = snap.val();
        let html = '';
        for (let id in invs) if (invs[id].status === 'menunggu verifikasi') {
          html += `<div class="admin-card"><strong>${invs[id].customerName}</strong> - Rp${invs[id].total}<br>
            <button class="btn btn--sm btn--primary approve-pay" data-id="${id}">Approve</button>
            <button class="btn btn--sm btn--ghost reject-pay" data-id="${id}">Reject</button></div>`;
        }
        document.getElementById('paymentList').innerHTML = html || '<p>Tidak ada.</p>';
        document.querySelectorAll('.approve-pay').forEach(b => b.addEventListener('click', e => update(ref(db, `invoices/${e.target.dataset.id}`), { status: 'paid' })));
        document.querySelectorAll('.reject-pay').forEach(b => b.addEventListener('click', e => update(ref(db, `invoices/${e.target.dataset.id}`), { status: 'rejected' })));
      });
    }
    function loadInvoices(container) {
      container.innerHTML = `<h2>Semua Invoice</h2><div id="allInvoices"></div>`;
      onValue(ref(db, 'invoices'), snap => {
        const invs = snap.val();
        let html = '<table class="data-table"><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th></tr>';
        for (let id in invs) html += `<tr><td>${id}</td><td>${invs[id].customerName}</td><td>Rp${invs[id].total}</td><td>${invs[id].status}</td></tr>`;
        document.getElementById('allInvoices').innerHTML = html + '</table>';
      });
    }
  </script>
</body>
</html>
