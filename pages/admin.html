<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Panel — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-width: 280px;
      --color-bg: #ffffff; --color-bg-secondary: #f9fafb; --color-card-bg: #ffffff;
      --color-text: #0a0a0b; --color-text-secondary: #52525b; --color-border: #e4e4e7;
      --color-purple: #7c3aed; --color-purple-bg: rgba(124,58,237,0.04);
      --shadow-card: 0 4px 12px rgba(0,0,0,0.03);
    }
    [data-theme="dark"] {
      --color-bg: #0f0f11; --color-bg-secondary: #1a1a1e; --color-card-bg: #1e1e22;
      --color-text: #f1f1f3; --color-text-secondary: #a1a1aa; --color-border: #2a2a2e;
      --shadow-card: 0 4px 12px rgba(0,0,0,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background:var(--color-bg); color:var(--color-text); }
    .admin-spa { display:flex; min-height:100vh; background:var(--color-bg-secondary); }
    .sidebar { width:var(--sidebar-width); background:var(--color-card-bg); border-right:1px solid var(--color-border); padding:1.75rem 1.25rem; position:fixed; top:0; left:0; bottom:0; z-index:100; display:flex; flex-direction:column; transition:0.3s; overflow-y:auto; }
    .sidebar__brand { font-weight:700; font-size:1.4rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:2rem; color:var(--color-text); }
    .sidebar__nav { display:flex; flex-direction:column; gap:0.3rem; flex:1; }
    .sidebar__link { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:0.5rem; font-weight:500; color:var(--color-text-secondary); cursor:pointer; border:none; background:transparent; width:100%; text-align:left; font-size:0.95rem; transition:0.2s; }
    .sidebar__link:hover, .sidebar__link.active { background:var(--color-purple-bg); color:var(--color-purple); }
    .sidebar__footer { margin-top:auto; border-top:1px solid var(--color-border); padding-top:1rem; display:flex; flex-direction:column; gap:0.5rem; }
    .theme-toggle { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--color-text); }
    .main-content { margin-left:var(--sidebar-width); flex:1; padding:2rem; transition:margin 0.3s; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
    .section-panel { display:none; } .section-panel.active { display:block; }
    .grid { display:grid; gap:1.5rem; } .grid-cols-4 { grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); }
    .stat-card { background:var(--color-card-bg); border:1px solid var(--color-border); border-radius:1rem; padding:1.5rem; box-shadow:var(--shadow-card); }
    .badge { display:inline-block; padding:0.2rem 0.8rem; border-radius:100px; font-size:0.8rem; font-weight:600; }
    .badge-success { background:#d1fae5; color:#065f46; } .badge-danger { background:#fee2e2; color:#991b1b; } .badge-info { background:#dbeafe; color:#1e40af; }
    .progress-bar { height:8px; background:var(--color-border); border-radius:4px; overflow:hidden; } .progress-fill { height:100%; background:var(--color-purple); border-radius:4px; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.5rem 1rem; border-radius:0.5rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:0.2s; }
    .btn--primary { background:var(--color-purple); color:white; } .btn--ghost { background:transparent; border-color:var(--color-border); color:var(--color-text); }
    .btn--sm { padding:0.3rem 0.75rem; font-size:0.85rem; }
    .hamburger { display:none; background:none; border:none; font-size:1.8rem; cursor:pointer; color:var(--color-text); }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:0.75rem; text-align:left; border-bottom:1px solid var(--color-border); }
    th { background:var(--color-bg-secondary); }
    @media (max-width:768px) {
      .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); }
      .main-content { margin-left:0; padding:1.5rem; } .hamburger { display:block; }
    }
    /* Modal */
    .modal-full { position:fixed; inset:0; background:var(--color-bg); z-index:200; display:flex; flex-direction:column; }
    .modal-header { padding:1rem 2rem; border-bottom:1px solid var(--color-border); display:flex; align-items:center; gap:1rem; }
    .modal-header .back-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--color-text); }
    .modal-body { flex:1; overflow-y:auto; padding:2rem; }
    .tab-nav { display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .tab-btn { padding:0.5rem 1rem; border-radius:0.5rem; border:1px solid var(--color-border); background:transparent; cursor:pointer; font-weight:500; color:var(--color-text-secondary); }
    .tab-btn.active { background:var(--color-purple); color:white; border-color:var(--color-purple); }
    .tab-content { display:none; } .tab-content.active { display:block; }
    .editable-field { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.8rem; }
    .editable-field label { min-width:140px; } .editable-field input, .editable-field select, .editable-field textarea { flex:1; padding:0.5rem; border:1px solid var(--color-border); border-radius:0.5rem; background:var(--color-bg); color:var(--color-text); }
    .website-preview { width:100%; height:200px; object-fit:cover; border-radius:1rem; border:1px solid var(--color-border); }
    .editor-layout { display:flex; gap:1.5rem; }
    .page-list { width:200px; border-right:1px solid var(--color-border); padding-right:1rem; }
    .page-list button { display:block; width:100%; margin-bottom:0.5rem; }
    .page-edit-area { flex:1; }
    .page-editor textarea { width:100%; min-height:300px; font-family:monospace; }
  </style>
</head>
<body>
  <div id="loadingOverlay" style="position:fixed;inset:0;background:var(--color-bg);display:flex;align-items:center;justify-content:center;z-index:9999;">⏳ Memuat...</div>

  <div class="admin-spa" id="adminContainer" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand"><span style="color:var(--color-purple);">✦</span> Dipta Admin</div>
      <nav class="sidebar__nav">
        <button class="sidebar__link active" data-section="overview"><i class="fas fa-dashboard"></i> Overview</button>
        <button class="sidebar__link" data-section="websites"><i class="fas fa-globe"></i> Websites</button>
        <button class="sidebar__link" data-section="users"><i class="fas fa-users"></i> Users</button>
        <button class="sidebar__link" data-section="invoices"><i class="fas fa-file-invoice"></i> Invoices</button>
        <button class="sidebar__link" data-section="domains"><i class="fas fa-link"></i> Domains</button>
        <button class="sidebar__link" data-section="portfolio"><i class="fas fa-image"></i> Portfolio</button>
        <button class="sidebar__link" data-section="consultations"><i class="fas fa-comments"></i> Konsultasi</button>
        <button class="sidebar__link" data-section="monitoring"><i class="fas fa-chart-line"></i> Monitoring</button>
        <button class="sidebar__link" data-section="backup"><i class="fas fa-database"></i> Backup</button>
        <button class="sidebar__link" data-section="errors"><i class="fas fa-bug"></i> Errors</button>
        <button class="sidebar__link" data-section="settings"><i class="fas fa-cog"></i> Settings</button>
      </nav>
      <div class="sidebar__footer">
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn--ghost btn--full" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</button>
      </div>
    </aside>

    <main class="main-content">
      <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
      <div class="top-bar"><h2>Admin Dashboard</h2></div>

      <!-- OVERVIEW -->
      <div class="section-panel active" id="panel-overview">
        <div class="grid grid-cols-4" id="adminStats"></div>
        <div style="margin:2rem 0;">
          <h3>Recent Activities</h3>
          <div id="recentActivities"></div>
        </div>
      </div>

      <!-- WEBSITES -->
      <div class="section-panel" id="panel-websites">
        <h2>Manajemen Website</h2>
        <div id="adminWebsitesTable"></div>
      </div>

      <!-- USERS -->
      <div class="section-panel" id="panel-users"><h2>Daftar User</h2><table id="adminUsersTable"><tr><th>UID</th><th>Nama</th><th>Email</th><th>Role</th></tr></table></div>

      <!-- INVOICES -->
      <div class="section-panel" id="panel-invoices"><h2>Semua Invoice</h2><div id="adminInvoicesTable"></div></div>

      <!-- DOMAINS -->
      <div class="section-panel" id="panel-domains">
        <h2>Domain List</h2>
        <form id="addDomainForm" style="display:flex; gap:1rem; margin-bottom:1rem;">
          <input type="text" id="domainNameInput" placeholder="Nama domain (.com)" required>
          <input type="text" id="domainPriceInput" placeholder="Harga" required>
          <button type="submit" class="btn btn--primary btn--sm">Tambah</button>
        </form>
        <table id="adminDomainsTable"><tr><th>Domain</th><th>Harga</th><th>Aksi</th></tr></table>
      </div>

      <!-- PORTFOLIO -->
      <div class="section-panel" id="panel-portfolio">
        <h2>Portfolio</h2>
        <form id="addPortfolioForm" style="display:flex; gap:1rem; margin-bottom:1rem;">
          <input type="text" id="portoTitle" placeholder="Judul" required>
          <input type="text" id="portoDesc" placeholder="Deskripsi">
          <button type="submit" class="btn btn--primary btn--sm">Tambah</button>
        </form>
        <div id="adminPortfolioList"></div>
      </div>

      <!-- CONSULTATIONS -->
      <div class="section-panel" id="panel-consultations"><h2>Pesan Konsultasi</h2><div id="adminConsultList"></div></div>

      <!-- MONITORING -->
      <div class="section-panel" id="panel-monitoring">
        <h2>System Monitoring</h2>
        <form id="monitoringForm">
          <div class="editable-field"><label>CPU (%)</label><input type="number" id="cpuInput" min="0" max="100" required></div>
          <div class="editable-field"><label>RAM (%)</label><input type="number" id="ramInput" min="0" max="100" required></div>
          <div class="editable-field"><label>Storage (%)</label><input type="number" id="storageInput" min="0" max="100" required></div>
          <button type="submit" class="btn btn--primary btn--sm">Update</button>
        </form>
      </div>

      <!-- BACKUP -->
      <div class="section-panel" id="panel-backup">
        <h2>Backup</h2>
        <form id="backupForm">
          <div class="editable-field"><label>Last Backup</label><input type="datetime-local" id="backupTime" required></div>
          <div class="editable-field"><label>Size</label><input type="text" id="backupSize" required></div>
          <div class="editable-field"><label>Status</label><select id="backupStatusSelect"><option value="success">Success</option><option value="failed">Failed</option></select></div>
          <button type="submit" class="btn btn--primary btn--sm">Update</button>
        </form>
      </div>

      <!-- ERRORS -->
      <div class="section-panel" id="panel-errors">
        <h2>Error Logs</h2>
        <form id="addErrorForm" style="display:flex; gap:1rem; margin-bottom:1rem;">
          <input type="text" id="errorMessage" placeholder="Pesan error" required>
          <button type="submit" class="btn btn--primary btn--sm">Tambah</button>
        </form>
        <div id="adminErrorList"></div>
      </div>

      <!-- SETTINGS -->
      <div class="section-panel" id="panel-settings">
        <h2>Global Settings</h2>
        <form id="settingsForm">
          <div class="editable-field"><label>Maintenance Mode</label>
            <select id="maintenanceMode"><option value="false">Off</option><option value="true">On</option></select></div>
          <button type="submit" class="btn btn--primary btn--sm">Simpan</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Full Screen Modal for Project Edit -->
  <div id="projectEditModal" style="display:none;" class="modal-full">
    <div class="modal-header">
      <button class="back-btn" onclick="document.getElementById('projectEditModal').style.display='none'"><i class="fas fa-arrow-left"></i></button>
      <h2 id="modalProjectTitle">Edit Project</h2>
    </div>
    <div class="modal-body" id="modalProjectBody"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, update, push, remove, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
      authDomain: "diptadigital-service.firebaseapp.com",
      databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "diptadigital-service",
      storageBucket: "diptadigital-service.firebasestorage.app",
      messagingSenderId: "411938166244",
      appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Dark mode
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') { html.setAttribute('data-theme', 'dark'); themeToggle.innerHTML = '<i class="fas fa-sun"></i>'; }
    themeToggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    });

    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== "admin@diptadigital.com" || !sessionStorage.getItem('adminLogin')) {
        window.location.href = 'admin-login.html';
        return;
      }
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('adminContainer').style.display = 'flex';
      initAdmin();
    });

    function initAdmin() {
      document.getElementById('logoutBtn').addEventListener('click', () => {
        sessionStorage.removeItem('adminLogin');
        signOut(auth).then(() => window.location.href = 'admin-login.html');
      });

      document.querySelectorAll('.sidebar__link').forEach(link => {
        link.addEventListener('click', () => {
          document.querySelectorAll('.sidebar__link').forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
          document.getElementById('panel-' + link.dataset.section).classList.add('active');
          document.getElementById('sidebar').classList.remove('open');
        });
      });
      document.getElementById('hamburgerBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

      loadOverview();
      loadWebsites();
      loadUsers();
      loadInvoices();
      loadDomains();
      loadPortfolio();
      loadConsultations();
      loadMonitoring();
      loadBackup();
      loadErrors();
      loadSettings();
    }

    function loadOverview() {
      onValue(ref(db, 'users'), (snap) => {
        const totalUsers = snap.size;
        onValue(ref(db, 'invoices'), (invSnap) => {
          const invs = invSnap.val() || {};
          const pending = Object.values(invs).filter(i => i.status === 'menunggu verifikasi');
          const paid = Object.values(invs).filter(i => i.status === 'paid' || i.status === 'lunas');
          const revenue = paid.reduce((s, i) => s + (i.total || 0), 0);
          document.getElementById('adminStats').innerHTML = `
            <div class="stat-card"><h3>${totalUsers}</h3><p>Total Users</p></div>
            <div class="stat-card"><h3>${Object.keys(invs).length}</h3><p>Total Invoices</p></div>
            <div class="stat-card"><h3>Rp${revenue.toLocaleString()}</h3><p>Pendapatan</p></div>
            <div class="stat-card"><h3>${pending.length}</h3><p>Verifikasi Pending</p></div>`;
        });
      });

      onValue(ref(db, 'activities'), (snap) => {
        const acts = snap.val() || {};
        const sorted = Object.values(acts).sort((a,b) => b.timestamp - a.timestamp).slice(0,5);
        document.getElementById('recentActivities').innerHTML = sorted.length ? 
          sorted.map(a => `<div style="padding:0.5rem 0; border-bottom:1px solid var(--color-border);">${new Date(a.timestamp).toLocaleString()}: ${a.message}</div>`).join('') :
          '<p style="color:var(--color-text-secondary);">Belum ada aktivitas.</p>';
      });
    }

    function loadWebsites() {
      onValue(ref(db, 'projects'), (snap) => {
        const all = snap.val() || {};
        let html = '<table><tr><th>User</th><th>Project</th><th>Package</th><th>Domain</th><th>Status</th><th>Aksi</th></tr>';
        for (let uid in all) for (let pid in all[uid]) {
          const p = all[uid][pid];
          html += `<tr><td>${uid}</td><td>${pid}</td><td>${p.package}</td><td>${p.domain || '-'}</td><td>${p.status}</td>
            <td><button class="btn btn--sm btn--primary edit-project" data-uid="${uid}" data-pid="${pid}">Edit</button></td></tr>`;
        }
        document.getElementById('adminWebsitesTable').innerHTML = html + '</table>';
        document.querySelectorAll('.edit-project').forEach(b => b.addEventListener('click', () => openProjectEdit(b.dataset.uid, b.dataset.pid)));
      });
    }

    function loadUsers() {
      onValue(ref(db, 'users'), (snap) => {
        const users = snap.val() || {};
        let html = '<tr><th>UID</th><th>Nama</th><th>Email</th><th>Role</th></tr>';
        for (let id in users) html += `<tr><td>${id}</td><td>${users[id].name || '-'}</td><td>${users[id].email || '-'}</td><td>${users[id].role || 'user'}</td></tr>`;
        document.getElementById('adminUsersTable').innerHTML = html;
      });
    }

    function loadInvoices() {
      onValue(ref(db, 'invoices'), (snap) => {
        const invs = snap.val() || {};
        let html = '<table><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Aksi</th></tr>';
        for (let id in invs) {
          const inv = invs[id];
          html += `<tr><td>${id}</td><td>${inv.customerName}</td><td>Rp${(inv.total||0).toLocaleString()}</td><td><span class="badge ${inv.status==='paid'?'badge-success':inv.status==='menunggu verifikasi'?'badge-info':'badge-danger'}">${inv.status}</span></td>
            <td><button class="btn btn--sm btn--primary approve-inv" data-id="${id}">Approve</button> <button class="btn btn--sm btn--ghost reject-inv" data-id="${id}">Reject</button></td></tr>`;
        }
        document.getElementById('adminInvoicesTable').innerHTML = html + '</table>';
        document.querySelectorAll('.approve-inv').forEach(b => b.addEventListener('click', () => update(ref(db, `invoices/${b.dataset.id}`), { status: 'paid' })));
        document.querySelectorAll('.reject-inv').forEach(b => b.addEventListener('click', () => update(ref(db, `invoices/${b.dataset.id}`), { status: 'rejected' })));
      });
    }

    function loadDomains() {
      onValue(ref(db, 'domainList'), (snap) => {
        const list = snap.val() || {};
        let html = '<tr><th>Domain</th><th>Harga</th><th>Aksi</th></tr>';
        for (let id in list) html += `<tr><td>${list[id].name}</td><td>${list[id].price}</td><td><button class="btn btn--sm btn--ghost del-domain" data-id="${id}">Hapus</button></td></tr>`;
        document.getElementById('adminDomainsTable').innerHTML = html;
        document.querySelectorAll('.del-domain').forEach(b => b.addEventListener('click', () => remove(ref(db, `domainList/${b.dataset.id}`))));
      });
      document.getElementById('addDomainForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('domainNameInput').value.trim();
        const price = document.getElementById('domainPriceInput').value.trim();
        if (!name || !price) return;
        set(ref(db, `domainList/${name.replace(/\./g, '_')}`), { name, price });
        e.target.reset();
      });
    }

    function loadPortfolio() {
      onValue(ref(db, 'portfolio'), (snap) => {
        const items = snap.val() || {};
        let html = '';
        for (let id in items) html += `<div class="stat-card" style="display:flex; justify-content:space-between;"><div><strong>${items[id].title}</strong><br>${items[id].desc || ''}</div><button class="btn btn--sm btn--ghost del-porto" data-id="${id}">Hapus</button></div>`;
        document.getElementById('adminPortfolioList').innerHTML = html || '<p>Tidak ada portfolio.</p>';
        document.querySelectorAll('.del-porto').forEach(b => b.addEventListener('click', () => remove(ref(db, `portfolio/${b.dataset.id}`))));
      });
      document.getElementById('addPortfolioForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('portoTitle').value.trim();
        const desc = document.getElementById('portoDesc').value.trim();
        if (!title) return;
        push(ref(db, 'portfolio'), { title, desc });
        e.target.reset();
      });
    }

    function loadConsultations() {
      onValue(ref(db, 'consultations'), (snap) => {
        const data = snap.val() || {};
        let html = '';
        for (let uid in data) for (let mid in data[uid]) html += `<div class="stat-card"><strong>${uid}:</strong> ${data[uid][mid].message}</div>`;
        document.getElementById('adminConsultList').innerHTML = html || '<p>Tidak ada pesan.</p>';
      });
    }

    function loadMonitoring() {
      onValue(ref(db, 'settings/monitoring'), (snap) => {
        const m = snap.val() || { cpu: 45, ram: 60, storage: 30 };
        document.getElementById('cpuInput').value = m.cpu;
        document.getElementById('ramInput').value = m.ram;
        document.getElementById('storageInput').value = m.storage;
      });
      document.getElementById('monitoringForm').addEventListener('submit', (e) => {
        e.preventDefault();
        set(ref(db, 'settings/monitoring'), {
          cpu: parseInt(document.getElementById('cpuInput').value),
          ram: parseInt(document.getElementById('ramInput').value),
          storage: parseInt(document.getElementById('storageInput').value)
        });
        alert('Monitoring updated');
      });
    }

    function loadBackup() {
      onValue(ref(db, 'settings/backup'), (snap) => {
        const b = snap.val() || { lastBackup: new Date().toISOString(), size: '150MB', status: 'success' };
        document.getElementById('backupTime').value = new Date(b.lastBackup).toISOString().slice(0,16);
        document.getElementById('backupSize').value = b.size;
        document.getElementById('backupStatusSelect').value = b.status;
      });
      document.getElementById('backupForm').addEventListener('submit', (e) => {
        e.preventDefault();
        set(ref(db, 'settings/backup'), {
          lastBackup: new Date(document.getElementById('backupTime').value).toISOString(),
          size: document.getElementById('backupSize').value,
          status: document.getElementById('backupStatusSelect').value
        });
        alert('Backup info updated');
      });
    }

    function loadErrors() {
      onValue(ref(db, 'errorLogs'), (snap) => {
        const errs = snap.val() || {};
        let html = '';
        for (let id in errs) html += `<div class="stat-card" style="display:flex; justify-content:space-between;">
          <div>${errs[id].message} <small>${new Date(errs[id].timestamp).toLocaleString()}</small></div>
          <button class="btn btn--sm btn--ghost resolve-err" data-id="${id}">${errs[id].resolved ? 'Unresolve' : 'Resolve'}</button></div>`;
        document.getElementById('adminErrorList').innerHTML = html || '<p>Tidak ada error.</p>';
        document.querySelectorAll('.resolve-err').forEach(b => b.addEventListener('click', () => {
          const current = errs[b.dataset.id]?.resolved || false;
          update(ref(db, `errorLogs/${b.dataset.id}`), { resolved: !current });
        }));
      });
      document.getElementById('addErrorForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const msg = document.getElementById('errorMessage').value.trim();
        if (!msg) return;
        push(ref(db, 'errorLogs'), { message: msg, timestamp: Date.now(), resolved: false });
        e.target.reset();
      });
    }

    function loadSettings() {
      onValue(ref(db, 'settings/maintenance'), (snap) => {
        document.getElementById('maintenanceMode').value = snap.val() ? 'true' : 'false';
      });
      document.getElementById('settingsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        set(ref(db, 'settings/maintenance'), document.getElementById('maintenanceMode').value === 'true');
        alert('Pengaturan disimpan');
      });
    }

    // ===== MODAL EDIT PROJECT (FULL SCREEN) =====
    async function openProjectEdit(uid, pid) {
      const snap = await get(child(ref(db), `projects/${uid}/${pid}`));
      if (!snap.exists()) return;
      const project = snap.val();
      project.id = pid;
      project.uid = uid;

      document.getElementById('modalProjectTitle').textContent = project.package + ' — Admin Edit';
      const body = document.getElementById('modalProjectBody');
      body.innerHTML = `
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="tab-settings">Settings</button>
          <button class="tab-btn" data-tab="tab-deploy">Deploy</button>
          <button class="tab-btn" data-tab="tab-logs">Logs</button>
          <button class="tab-btn" data-tab="tab-errors">Errors</button>
          <button class="tab-btn" data-tab="tab-editor">Website Editor</button>
        </div>
        <div id="tab-settings" class="tab-content active"></div>
        <div id="tab-deploy" class="tab-content"></div>
        <div id="tab-logs" class="tab-content"></div>
        <div id="tab-errors" class="tab-content"></div>
        <div id="tab-editor" class="tab-content"></div>
      `;
      document.getElementById('projectEditModal').style.display = 'flex';

      body.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          body.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          body.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          document.getElementById(btn.dataset.tab).classList.add('active');
        });
      });

      // Settings tab
      const settingsTab = document.getElementById('tab-settings');
      settingsTab.innerHTML = `
        <div class="editable-field"><label>Website Name</label><input type="text" id="editName" value="${project.businessName || ''}"></div>
        <div class="editable-field"><label>Description</label><textarea id="editDesc">${project.description || ''}</textarea></div>
        <div class="editable-field"><label>Logo URL</label><input type="text" id="editLogo" value="${project.logo || ''}"></div>
        <div class="editable-field"><label>Domain</label><input type="text" id="editDomain" value="${project.domain || ''}"></div>
        <div class="editable-field"><label>Version</label><input type="text" id="editVersion" value="${project.version || '1.0.0'}"></div>
        <div class="editable-field"><label>Status</label>
          <select id="editStatus">
            <option ${project.status==='dp_pending'?'selected':''}>dp_pending</option>
            <option ${project.status==='in progress'?'selected':''}>in progress</option>
            <option ${project.status==='completed'?'selected':''}>completed</option>
          </select></div>
        <div class="editable-field"><label>Progress</label><input type="number" id="editProgress" value="${project.progress||0}" min="0" max="100"></div>
        <button class="btn btn--primary" id="saveSettingsBtn">Simpan</button>
      `;
      document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
        await update(ref(db, `projects/${uid}/${pid}`), {
          businessName: document.getElementById('editName').value,
          description: document.getElementById('editDesc').value,
          logo: document.getElementById('editLogo').value,
          domain: document.getElementById('editDomain').value,
          version: document.getElementById('editVersion').value,
          status: document.getElementById('editStatus').value,
          progress: parseInt(document.getElementById('editProgress').value)
        });
        alert('Pengaturan disimpan');
        document.getElementById('projectEditModal').style.display = 'none';
      });

      // Deploy tab
      const deployTab = document.getElementById('tab-deploy');
      onValue(ref(db, `projects/${uid}/${pid}/deploy`), (snap) => {
        const d = snap.val() || { version: '1.0.0', branch: 'main', environment: 'production', lastDeploy: new Date().toISOString(), status: 'success' };
        deployTab.innerHTML = `
          <div class="editable-field"><label>Version</label><input type="text" id="deployVersion" value="${d.version}"></div>
          <div class="editable-field"><label>Branch</label><input type="text" id="deployBranch" value="${d.branch}"></div>
          <div class="editable-field"><label>Environment</label><select id="deployEnv"><option ${d.environment==='production'?'selected':''}>production</option><option ${d.environment==='development'?'selected':''}>development</option></select></div>
          <div class="editable-field"><label>Status</label><select id="deployStatus"><option ${d.status==='success'?'selected':''}>success</option><option ${d.status==='failed'?'selected':''}>failed</option></select></div>
          <button class="btn btn--primary" id="saveDeployBtn">Simpan Deploy</button>
        `;
        document.getElementById('saveDeployBtn').addEventListener('click', () => {
          set(ref(db, `projects/${uid}/${pid}/deploy`), {
            version: document.getElementById('deployVersion').value,
            branch: document.getElementById('deployBranch').value,
            environment: document.getElementById('deployEnv').value,
            status: document.getElementById('deployStatus').value,
            lastDeploy: new Date().toISOString()
          });
          push(ref(db, `projects/${uid}/${pid}/logs`), { message: 'Deploy updated by admin', timestamp: Date.now() });
          alert('Deploy updated');
        });
      });

      // Logs tab
      const logsTab = document.getElementById('tab-logs');
      onValue(ref(db, `projects/${uid}/${pid}/logs`), (snap) => {
        const logs = snap.val() || {};
        const sorted = Object.values(logs).sort((a,b) => b.timestamp - a.timestamp).slice(0,10);
        logsTab.innerHTML = sorted.map(l => `<div>${new Date(l.timestamp).toLocaleString()}: ${l.message}</div>`).join('') || '<p>Tidak ada log.</p>';
      });

      // Errors tab
      const errorsTab = document.getElementById('tab-errors');
      onValue(ref(db, `projects/${uid}/${pid}/errors`), (snap) => {
        const errs = snap.val() || {};
        errorsTab.innerHTML = Object.values(errs).map(e => `<div><span class="badge badge-${e.resolved?'success':'danger'}">${e.resolved?'Resolved':'Unresolved'}</span> ${e.message}</div>`).join('') || '<p>Tidak ada error.</p>';
      });

      // Website Editor tab
      const editorTab = document.getElementById('tab-editor');
      const websiteSnap = await get(child(ref(db), `websites/${uid}/${pid}/pages`));
      const pages = websiteSnap.val() || {};
      renderAdminEditor(editorTab, uid, pid, pages);
    }

    function renderAdminEditor(container, uid, pid, pages) {
      const pageIds = Object.keys(pages);
      container.innerHTML = `
        <div class="editor-layout">
          <div class="page-list">
            <h4>Halaman</h4>
            ${pageIds.map(id => `<button class="btn btn--ghost btn--sm page-select-btn" data-page="${id}" style="text-align:left;">${pages[id].title || id}</button>`).join('')}
          </div>
          <div class="page-edit-area" id="adminPageEditArea">
            ${pageIds.length > 0 ? '' : '<p>Pilih halaman untuk diedit.</p>'}
          </div>
        </div>
      `;
      const editArea = document.getElementById('adminPageEditArea');
      const showPage = (pageId) => {
        const page = pages[pageId] || { title: '', content: '' };
        editArea.innerHTML = `
          <div class="editable-field"><label>Judul</label><input type="text" id="pageTitle" value="${page.title}"></div>
          <div class="page-editor"><label>Konten HTML</label><textarea id="pageContent">${page.content}</textarea></div>
          <button class="btn btn--primary" id="savePageBtn" data-page="${pageId}">Simpan Halaman</button>
        `;
        document.getElementById('savePageBtn').addEventListener('click', () => {
          update(ref(db, `websites/${uid}/${pid}/pages/${pageId}`), {
            title: document.getElementById('pageTitle').value,
            content: document.getElementById('pageContent').value
          });
          alert('Halaman disimpan');
        });
      };
      if (pageIds.length > 0) showPage(pageIds[0]);
      container.querySelectorAll('.page-select-btn').forEach(btn => {
        btn.addEventListener('click', () => showPage(btn.dataset.page));
      });
    }
  </script>
</body>
</html>
