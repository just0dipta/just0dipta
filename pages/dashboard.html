<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-width: 280px;
      --color-bg: #ffffff; --color-bg-secondary: #f9fafb; --color-card-bg: #ffffff;
      --color-text: #0a0a0b; --color-text-secondary: #52525b; --color-border: #e4e4e7;
      --color-purple: #7c3aed; --color-purple-bg: rgba(124,58,237,0.04);
      --shadow-card: 0 4px 12px rgba(0,0,0,0.03);
    }
    [data-theme="dark"] {
      --color-bg: #0f0f11; --color-bg-secondary: #1a1a1e; --color-card-bg: #1e1e22;
      --color-text: #f1f1f3; --color-text-secondary: #a1a1aa; --color-border: #2a2a2e;
      --shadow-card: 0 4px 12px rgba(0,0,0,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background:var(--color-bg); color:var(--color-text); }
    .dashboard-spa { display:flex; min-height:100vh; background:var(--color-bg-secondary); }
    .sidebar { width:var(--sidebar-width); background:var(--color-card-bg); border-right:1px solid var(--color-border); padding:1.75rem 1.25rem; position:fixed; top:0; left:0; bottom:0; z-index:100; display:flex; flex-direction:column; transition:0.3s; overflow-y:auto; }
    .sidebar__brand { font-weight:700; font-size:1.4rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:2rem; color:var(--color-text); }
    .sidebar__nav { display:flex; flex-direction:column; gap:0.3rem; flex:1; }
    .sidebar__link { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:0.5rem; font-weight:500; color:var(--color-text-secondary); cursor:pointer; border:none; background:transparent; width:100%; text-align:left; font-size:0.95rem; transition:0.2s; }
    .sidebar__link:hover, .sidebar__link.active { background:var(--color-purple-bg); color:var(--color-purple); }
    .sidebar__footer { margin-top:auto; border-top:1px solid var(--color-border); padding-top:1rem; display:flex; flex-direction:column; gap:0.5rem; }
    .theme-toggle { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--color-text); }
    .main-content { margin-left:var(--sidebar-width); flex:1; padding:2rem; transition:margin 0.3s; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
    .section-panel { display:none; } .section-panel.active { display:block; }
    .grid { display:grid; gap:1.5rem; } .grid-cols-4 { grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); }
    .stat-card { background:var(--color-card-bg); border:1px solid var(--color-border); border-radius:1rem; padding:1.5rem; box-shadow:var(--shadow-card); transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    .website-card { cursor:pointer; }
    .badge { display:inline-block; padding:0.2rem 0.8rem; border-radius:100px; font-size:0.8rem; font-weight:600; }
    .badge-success { background:#d1fae5; color:#065f46; } .badge-danger { background:#fee2e2; color:#991b1b; } .badge-info { background:#dbeafe; color:#1e40af; }
    .progress-bar { height:8px; background:var(--color-border); border-radius:4px; overflow:hidden; } .progress-fill { height:100%; background:var(--color-purple); border-radius:4px; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.5rem 1rem; border-radius:0.5rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:0.2s; }
    .btn--primary { background:var(--color-purple); color:white; } .btn--ghost { background:transparent; border-color:var(--color-border); color:var(--color-text); }
    .btn--sm { padding:0.3rem 0.75rem; font-size:0.85rem; }
    .hamburger { display:none; background:none; border:none; font-size:1.8rem; cursor:pointer; color:var(--color-text); }
    @media (max-width:768px) {
      .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); }
      .main-content { margin-left:0; padding:1.5rem; } .hamburger { display:block; }
    }
    /* Full Screen Modal */
    .modal-full { position:fixed; inset:0; background:var(--color-bg); z-index:200; display:flex; flex-direction:column; }
    .modal-header { padding:1rem 2rem; border-bottom:1px solid var(--color-border); display:flex; align-items:center; gap:1rem; }
    .modal-header .back-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--color-text); }
    .modal-body { flex:1; overflow-y:auto; padding:2rem; }
    .tab-nav { display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .tab-btn { padding:0.5rem 1rem; border-radius:0.5rem; border:1px solid var(--color-border); background:transparent; cursor:pointer; font-weight:500; color:var(--color-text-secondary); }
    .tab-btn.active { background:var(--color-purple); color:white; border-color:var(--color-purple); }
    .tab-content { display:none; } .tab-content.active { display:block; }
    .editable-field { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.8rem; }
    .editable-field label { min-width:140px; } .editable-field input, .editable-field select, .editable-field textarea { flex:1; padding:0.5rem; border:1px solid var(--color-border); border-radius:0.5rem; background:var(--color-bg); color:var(--color-text); }
    .website-preview { width:100%; height:200px; object-fit:cover; border-radius:1rem; border:1px solid var(--color-border); }

    /* Editor Layout */
    .editor-layout { display:flex; gap:1.5rem; }
    .page-list { width:200px; border-right:1px solid var(--color-border); padding-right:1rem; }
    .page-list button { display:block; width:100%; margin-bottom:0.5rem; }
    .page-edit-area { flex:1; }
    .page-editor textarea { width:100%; min-height:300px; font-family:monospace; }
  </style>
</head>
<body>
  <div id="loadingOverlay" style="position:fixed;inset:0;background:var(--color-bg);display:flex;align-items:center;justify-content:center;z-index:9999;">⏳ Memuat...</div>

  <div class="dashboard-spa" id="dashboardContainer" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand"><span style="color:var(--color-purple);">✦</span> DiptaDigital</div>
      <nav class="sidebar__nav">
        <button class="sidebar__link active" data-section="overview"><i class="fas fa-home"></i> Overview</button>
        <button class="sidebar__link" data-section="websites"><i class="fas fa-globe"></i> Website Saya</button>
        <button class="sidebar__link" data-section="domains"><i class="fas fa-link"></i> Domain</button>
        <button class="sidebar__link" data-section="billing"><i class="fas fa-file-invoice"></i> Invoice</button>
        <button class="sidebar__link" data-section="consultation"><i class="fab fa-whatsapp"></i> Konsultasi</button>
        <button class="sidebar__link" data-section="profile"><i class="fas fa-user"></i> Profil</button>
      </nav>
      <div class="sidebar__footer">
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn--ghost btn--full" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</button>
      </div>
    </aside>

    <main class="main-content">
      <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
      <div class="top-bar">
        <div><h1>Halo, <span id="displayName">User</span></h1></div>
        <div class="user-badge" style="display:flex; align-items:center; gap:0.8rem; background:var(--color-card-bg); padding:0.5rem 1rem; border-radius:100px;">
          <div id="avatarInitial" style="width:36px;height:36px;border-radius:50%;background:var(--color-purple);color:white;display:flex;align-items:center;justify-content:center;">U</div>
          <span id="userEmail">user@email.com</span>
        </div>
      </div>

      <!-- PANELS -->
      <div class="section-panel active" id="panel-overview">
        <div class="grid grid-cols-4" id="overviewStats"></div>
        <div style="margin:2rem 0;">
          <div style="display:flex; justify-content:space-between;"><h2>Semua Website Saya</h2><button class="btn btn--primary btn--sm" onclick="window.location.href='order.html'">+ Tambah Project</button></div>
          <div id="overviewAllProjects" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:1rem; margin-top:1rem;"></div>
        </div>
      </div>

      <!-- Other panels same as before -->
      <div class="section-panel" id="panel-websites">
        <div style="display:flex; justify-content:space-between;"><h2>Website Saya</h2><button class="btn btn--primary btn--sm" onclick="window.location.href='order.html'">+ Tambah Project</button></div>
        <div id="allProjectsGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:1rem; margin-top:1rem;"></div>
      </div>

      <div class="section-panel" id="panel-domains"><h2>Domain Saya</h2><button class="btn btn--primary btn--sm" onclick="window.location.href='domains.html'">Beli Domain Baru</button><div id="domainList" style="margin-top:1rem;"></div></div>
      <div class="section-panel" id="panel-billing"><h2>Invoice</h2><div id="invoiceList"></div></div>
      <div class="section-panel" id="panel-consultation">
        <h2>Konsultasi via WhatsApp</h2>
        <form id="consultForm" style="max-width:500px;">
          <div class="form-group"><label>Pilih Website</label><select id="consultWebsite"><option value="">-- Pilih --</option></select></div>
          <div class="form-group"><label>Topik Lain</label><input type="text" id="consultTopic" placeholder="Tulis pertanyaan..."></div>
          <button type="submit" class="btn btn--primary"><i class="fab fa-whatsapp"></i> Kirim</button>
        </form>
      </div>
      <div class="section-panel" id="panel-profile">
        <h2>Profil Saya</h2>
        <form id="profileForm" style="max-width:500px;">
          <div class="form-group"><label>Foto Profil</label><input type="file" id="photoInput" accept="image/*"></div>
          <div class="form-group"><label>Nama</label><input type="text" id="profileName" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="profileEmail" disabled></div>
          <button type="submit" class="btn btn--primary">Simpan</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Full Screen Modal -->
  <div id="websiteModal" style="display:none;" class="modal-full">
    <div class="modal-header">
      <button class="back-btn" onclick="document.getElementById('websiteModal').style.display='none'"><i class="fas fa-arrow-left"></i></button>
      <h2 id="modalTitle">Website Detail</h2>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, update, push, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
      authDomain: "diptadigital-service.firebaseapp.com",
      databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "diptadigital-service",
      storageBucket: "diptadigital-service.firebasestorage.app",
      messagingSenderId: "411938166244",
      appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // Dark mode
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') { html.setAttribute('data-theme', 'dark'); themeToggle.innerHTML = '<i class="fas fa-sun"></i>'; }
    themeToggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('dashboardContainer').style.display = 'flex';
      document.getElementById('displayName').textContent = user.displayName || 'User';
      document.getElementById('avatarInitial').textContent = (user.displayName || 'U')[0];
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('profileName').value = user.displayName || '';
      document.getElementById('profileEmail').value = user.email;
      initDashboard(user);
    });

    function initDashboard(user) {
      document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth).then(() => window.location.href = '../index.html'));

      document.querySelectorAll('.sidebar__link').forEach(link => {
        link.addEventListener('click', () => {
          document.querySelectorAll('.sidebar__link').forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
          document.getElementById('panel-' + link.dataset.section).classList.add('active');
          document.getElementById('sidebar').classList.remove('open');
        });
      });
      document.getElementById('hamburgerBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

      const projectsRef = ref(db, `projects/${user.uid}`);
      let projectsData = {};
      onValue(projectsRef, (snap) => {
        projectsData = snap.val() || {};
        const list = Object.entries(projectsData).map(([id, p]) => ({ id, ...p }));
        updateOverview(list);
        updateWebsiteCards(list, user);
        updateConsultSelect(list);
      });

      onValue(ref(db, `userDomains/${user.uid}`), (snap) => {
        const domains = snap.val() || {};
        document.getElementById('domainList').innerHTML = Object.entries(domains).map(([id, d]) => `<div style="padding:0.5rem 0;"><strong>${d.name}</strong> - Exp: ${d.expiry ? new Date(d.expiry).toLocaleDateString() : '-'}</div>`).join('') || '<p>Tidak ada domain.</p>';
      });

      onValue(ref(db, 'invoices'), (snap) => {
        const invs = snap.val() || {};
        const userInvs = Object.entries(invs).filter(([id, inv]) => inv.userId === user.uid);
        document.getElementById('invoiceList').innerHTML = userInvs.map(([id, inv]) => `<div style="display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid var(--color-border);"><span>${inv.package || inv.domain} (#${id})</span> <a href="invoice.html?id=${id}" class="btn btn--sm btn--ghost">Lihat</a></div>`).join('') || '<p>Tidak ada tagihan.</p>';
      });

      document.getElementById('consultForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const siteId = document.getElementById('consultWebsite').value;
        const topic = document.getElementById('consultTopic').value.trim();
        let msg = `Halo Dipta Digital, saya ingin konsultasi.`;
        if (siteId && projectsData[siteId]) msg += `\nTerkait website: ${projectsData[siteId].package}`;
        if (topic) msg += `\n\nPertanyaan: ${topic}`;
        msg += `\nUser ID: ${user.uid}`;
        window.open(`https://wa.me/62823641915?text=${encodeURIComponent(msg)}`, '_blank');
      });

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newName = document.getElementById('profileName').value.trim();
        const file = document.getElementById('photoInput').files[0];
        if (newName) { await updateProfile(user, { displayName: newName }); await set(ref(db, `users/${user.uid}/name`), newName); }
        if (file) {
          const storRef = sRef(storage, `avatars/${user.uid}`);
          await uploadBytes(storRef, file);
          const url = await getDownloadURL(storRef);
          await updateProfile(user, { photoURL: url });
          await set(ref(db, `users/${user.uid}/photoURL`), url);
        }
        alert('Profil diperbarui');
      });
    }

    function updateOverview(list) {
      document.getElementById('overviewStats').innerHTML = `
        <div class="stat-card"><h3>${list.length}</h3><p>Total Project</p></div>
        <div class="stat-card"><h3>${list.filter(p => p.status !== 'completed').length}</h3><p>Dalam Proses</p></div>
        <div class="stat-card"><h3>${list.filter(p => p.status === 'completed').length}</h3><p>Selesai</p></div>
        <div class="stat-card"><h3>0</h3><p>Domain Aktif</p></div>`;

      const overviewGrid = document.getElementById('overviewAllProjects');
      overviewGrid.innerHTML = list.map(p => `
        <div class="stat-card website-card" data-id="${p.id}">
          <h3>${p.package}</h3>
          <p>${p.domain || 'Tanpa domain'}</p>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.progress||0}%"></div></div>
          <span class="badge badge-${p.status==='completed'?'success':'info'}">${p.status}</span>
        </div>`).join('') || '<p>Belum ada project.</p>';
      overviewGrid.querySelectorAll('.website-card').forEach(c => c.addEventListener('click', () => openWebsiteModal(c.dataset.id)));
    }

    function updateWebsiteCards(list, user) {
      const grid = document.getElementById('allProjectsGrid');
      grid.innerHTML = list.map(p => `
        <div class="stat-card website-card" data-id="${p.id}" style="cursor:pointer;">
          <h3>${p.package}</h3>
          <p>${p.domain || 'Tanpa domain'}</p>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.progress||0}%"></div></div>
          <span class="badge badge-info">${p.status}</span>
        </div>`).join('') || '<p>Belum ada project.</p>';
      grid.querySelectorAll('.website-card').forEach(c => c.addEventListener('click', () => openWebsiteModal(c.dataset.id)));
    }

    function updateConsultSelect(list) {
      document.getElementById('consultWebsite').innerHTML = '<option value="">-- Pilih --</option>' + list.map(p => `<option value="${p.id}">${p.package}</option>`).join('');
    }

    // === Full Screen Modal with Professional Editor ===
    async function openWebsiteModal(projectId) {
      const user = auth.currentUser;
      const snap = await get(child(ref(db), `projects/${user.uid}/${projectId}`));
      if (!snap.exists()) return;
      const project = snap.val();
      project.id = projectId;

      document.getElementById('modalTitle').textContent = project.package + ' — Detail';
      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="tab-overview">Overview</button>
          <button class="tab-btn" data-tab="tab-settings">Settings</button>
          <button class="tab-btn" data-tab="tab-editor">Website Editor</button>
          <button class="tab-btn" data-tab="tab-deploy">Deploy</button>
          <button class="tab-btn" data-tab="tab-logs">Update Logs</button>
          <button class="tab-btn" data-tab="tab-monitoring">Monitoring</button>
          <button class="tab-btn" data-tab="tab-backup">Backup</button>
          <button class="tab-btn" data-tab="tab-errors">Errors</button>
        </div>
        <div id="tab-overview" class="tab-content active"></div>
        <div id="tab-settings" class="tab-content"></div>
        <div id="tab-editor" class="tab-content"></div>
        <div id="tab-deploy" class="tab-content"></div>
        <div id="tab-logs" class="tab-content"></div>
        <div id="tab-monitoring" class="tab-content"></div>
        <div id="tab-backup" class="tab-content"></div>
        <div id="tab-errors" class="tab-content"></div>
      `;
      document.getElementById('websiteModal').style.display = 'flex';

      // Tab switching
      body.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          body.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          body.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          const target = document.getElementById(btn.dataset.tab);
          if (target) target.classList.add('active');
        });
      });

      // Overview tab
      const overviewTab = document.getElementById('tab-overview');
      overviewTab.innerHTML = `
        <img src="${project.logo || 'https://via.placeholder.com/800x200'}" class="website-preview" alt="Preview">
        <h3>Status Server</h3>
        <div id="serverUptime">Memuat...</div>
        <canvas id="monitoringChart" width="400" height="200" style="max-width:100%; margin-top:1rem;"></canvas>
      `;
      document.getElementById('serverUptime').innerHTML = 'Uptime: 99.99% | Response: 45ms';
      const ctx = document.getElementById('monitoringChart').getContext('2d');
      let cpu = 40, ram = 60;
      setInterval(() => {
        cpu = Math.max(5, Math.min(95, cpu + (Math.random()-0.5)*10));
        ram = Math.max(5, Math.min(95, ram + (Math.random()-0.5)*10));
        ctx.clearRect(0,0,400,200);
        ctx.fillStyle = '#7c3aed';
        ctx.fillRect(50, 150-cpu, 80, cpu);
        ctx.fillStyle = '#a78bfa';
        ctx.fillRect(180, 150-ram, 80, ram);
        ctx.fillStyle = 'var(--color-text)';
        ctx.font = '12px sans-serif';
        ctx.fillText('CPU', 70, 170);
        ctx.fillText('RAM', 200, 170);
      }, 2000);

      // Settings tab
      const settingsTab = document.getElementById('tab-settings');
      const userDomainsSnap = await get(child(ref(db), `userDomains/${user.uid}`));
      const userDomains = userDomainsSnap.val() || {};
      const domainOptions = Object.values(userDomains).map(d => `<option value="${d.name}">${d.name}</option>`).join('');
      settingsTab.innerHTML = `
        <div class="editable-field"><label>Website Name</label><input type="text" id="editName" value="${project.businessName || ''}"></div>
        <div class="editable-field"><label>Description</label><textarea id="editDesc">${project.description || ''}</textarea></div>
        <div class="editable-field"><label>Logo URL</label><input type="text" id="editLogo" value="${project.logo || ''}"></div>
        <div class="editable-field"><label>Domain</label>
          <select id="editDomainSelect"><option value="">-- Pilih domain Anda --</option>${domainOptions}</select>
          <input type="text" id="editDomainManual" placeholder="Atau ketik manual" value="${project.domain || ''}" style="margin-top:0.3rem;">
        </div>
        <div class="editable-field"><label>Version</label><input type="text" id="editVersion" value="${project.version || '1.0.0'}"></div>
        <button class="btn btn--primary" id="saveSettingsBtn">Simpan</button>
      `;
      document.getElementById('editDomainSelect').value = project.domain || '';
      document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
        const domain = document.getElementById('editDomainSelect').value || document.getElementById('editDomainManual').value.trim();
        await update(ref(db, `projects/${user.uid}/${projectId}`), {
          businessName: document.getElementById('editName').value,
          description: document.getElementById('editDesc').value,
          logo: document.getElementById('editLogo').value,
          domain: domain,
          version: document.getElementById('editVersion').value
        });
        alert('Pengaturan disimpan');
        document.getElementById('websiteModal').style.display = 'none';
      });

      // ===== PROFESSIONAL WEBSITE EDITOR TAB =====
      const editorTab = document.getElementById('tab-editor');
      const websiteSnap = await get(child(ref(db), `websites/${user.uid}/${projectId}/pages`));
      const pages = websiteSnap.val() || {};
      renderProfessionalEditor(editorTab, user.uid, projectId, pages);

      // Deploy tab (per project)
      const deployTab = document.getElementById('tab-deploy');
      onValue(ref(db, `projects/${user.uid}/${projectId}/deploy`), (snap) => {
        const d = snap.val() || { version: '1.0.0', branch: 'main', environment: 'production', lastDeploy: new Date().toISOString(), status: 'success' };
        deployTab.innerHTML = `<p>Version: ${d.version} | Branch: ${d.branch} | Env: ${d.environment}</p><p>Last: ${new Date(d.lastDeploy).toLocaleString()} <span class="badge badge-${d.status==='success'?'success':'danger'}">${d.status}</span></p>`;
      });

      // Logs tab
      const logsTab = document.getElementById('tab-logs');
      onValue(ref(db, `projects/${user.uid}/${projectId}/logs`), (snap) => {
        const logs = snap.val() || {};
        const sorted = Object.values(logs).sort((a,b) => b.timestamp - a.timestamp).slice(0,10);
        logsTab.innerHTML = sorted.map(l => `<div>${new Date(l.timestamp).toLocaleString()}: ${l.message}</div>`).join('') || '<p>Tidak ada log.</p>';
      });

      // Monitoring tab
      const monitoringTab = document.getElementById('tab-monitoring');
      onValue(ref(db, 'settings/monitoring'), (snap) => {
        const m = snap.val() || { cpu: 45, ram: 60, storage: 30 };
        monitoringTab.innerHTML = `<p>CPU: ${m.cpu}% | RAM: ${m.ram}% | Storage: ${m.storage}%</p>`;
      });

      // Backup tab
      const backupTab = document.getElementById('tab-backup');
      onValue(ref(db, 'settings/backup'), (snap) => {
        const b = snap.val() || {};
        backupTab.innerHTML = `<p>Last Backup: ${b.lastBackup ? new Date(b.lastBackup).toLocaleString() : '-'} | Size: ${b.size || '-'}</p>`;
      });

      // Errors tab
      const errorsTab = document.getElementById('tab-errors');
      onValue(ref(db, `projects/${user.uid}/${projectId}/errors`), (snap) => {
        const errs = snap.val() || {};
        errorsTab.innerHTML = Object.values(errs).map(e => `<div><span class="badge badge-${e.resolved?'success':'danger'}">${e.resolved?'Resolved':'Unresolved'}</span> ${e.message}</div>`).join('') || '<p>Tidak ada error.</p>';
      });
    }

    function renderProfessionalEditor(container, uid, pid, pages) {
      const pageIds = Object.keys(pages);
      container.innerHTML = `
        <div class="editor-layout">
          <div class="page-list">
            <h4>Halaman</h4>
            ${pageIds.map(id => `<button class="btn btn--ghost btn--sm page-select-btn" data-page="${id}" style="text-align:left;">${pages[id].title || id}</button>`).join('')}
          </div>
          <div class="page-edit-area" id="pageEditArea">
            ${pageIds.length > 0 ? '' : '<p>Pilih halaman untuk diedit.</p>'}
          </div>
        </div>
      `;

      const editArea = document.getElementById('pageEditArea');
      const showPage = (pageId) => {
        const page = pages[pageId] || { title: '', content: '' };
        editArea.innerHTML = `
          <div class="editable-field"><label>Judul</label><input type="text" id="pageTitle" value="${page.title}"></div>
          <div class="page-editor"><label>Konten HTML</label><textarea id="pageContent">${page.content}</textarea></div>
          <button class="btn btn--primary" id="savePageBtn" data-page="${pageId}">Simpan Halaman</button>
        `;
        document.getElementById('savePageBtn').addEventListener('click', () => {
          const title = document.getElementById('pageTitle').value;
          const content = document.getElementById('pageContent').value;
          update(ref(db, `websites/${uid}/${pid}/pages/${pageId}`), { title, content });
          alert('Halaman disimpan');
        });
      };

      if (pageIds.length > 0) showPage(pageIds[0]);

      container.querySelectorAll('.page-select-btn').forEach(btn => {
        btn.addEventListener('click', () => showPage(btn.dataset.page));
      });
    }
  </script>
</body>
</html>
