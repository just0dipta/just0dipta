<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard — Dipta Digital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --sidebar-width: 280px;
      --color-bg: #ffffff; --color-bg-secondary: #f9fafb; --color-card-bg: #ffffff;
      --color-text: #0a0a0b; --color-text-secondary: #52525b; --color-border: #e4e4e7;
      --color-purple: #7c3aed; --color-purple-bg: rgba(124, 58, 237, 0.04);
      --shadow-card: 0 4px 12px rgba(0,0,0,0.03);
    }
    [data-theme="dark"] {
      --color-bg: #0f0f11; --color-bg-secondary: #1a1a1e; --color-card-bg: #1e1e22;
      --color-text: #f1f1f3; --color-text-secondary: #a1a1aa; --color-border: #2a2a2e;
      --shadow-card: 0 4px 12px rgba(0,0,0,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; background:var(--color-bg); color:var(--color-text); }
    .dashboard-spa { display:flex; min-height:100vh; background:var(--color-bg-secondary); }
    .sidebar { width:var(--sidebar-width); background:var(--color-card-bg); border-right:1px solid var(--color-border); padding:1.75rem 1.25rem; position:fixed; top:0; left:0; bottom:0; z-index:100; display:flex; flex-direction:column; transition:0.3s; overflow-y:auto; }
    .sidebar__brand { font-weight:700; font-size:1.4rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:2rem; color:var(--color-text); }
    .sidebar__brand span { color:var(--color-purple); font-size:1.8rem; }
    .sidebar__nav { display:flex; flex-direction:column; gap:0.3rem; flex:1; }
    .sidebar__link { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:0.5rem; font-weight:500; color:var(--color-text-secondary); cursor:pointer; border:none; background:transparent; width:100%; text-align:left; font-size:0.95rem; transition:0.2s; }
    .sidebar__link:hover, .sidebar__link.active { background:var(--color-purple-bg); color:var(--color-purple); }
    .sidebar__footer { margin-top:auto; border-top:1px solid var(--color-border); padding-top:1rem; display:flex; flex-direction:column; gap:0.5rem; }
    .theme-toggle { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--color-text); align-self:flex-start; padding:0.25rem; }
    .main-content { margin-left:var(--sidebar-width); flex:1; padding:2rem; background:var(--color-bg-secondary); }
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
    .section-panel { display:none; } .section-panel.active { display:block; }
    .grid { display:grid; gap:1.5rem; } .grid-cols-4 { grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); } .grid-cols-2 { grid-template-columns: 1fr 1fr; }
    .stat-card { background:var(--color-card-bg); border:1px solid var(--color-border); border-radius:1rem; padding:1.5rem; box-shadow:var(--shadow-card); }
    .badge { display:inline-block; padding:0.2rem 0.8rem; border-radius:100px; font-size:0.8rem; font-weight:600; }
    .badge-success { background:#d1fae5; color:#065f46; } .badge-danger { background:#fee2e2; color:#991b1b; } .badge-warning { background:#fef3c7; color:#92400e; } .badge-info { background:#dbeafe; color:#1e40af; }
    .progress-bar { height:8px; background:var(--color-border); border-radius:4px; overflow:hidden; } .progress-fill { height:100%; background:var(--color-purple); border-radius:4px; }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.5rem 1rem; border-radius:0.5rem; font-weight:600; cursor:pointer; border:1px solid transparent; transition:0.2s; }
    .btn--primary { background:var(--color-purple); color:white; } .btn--ghost { background:transparent; border-color:var(--color-border); color:var(--color-text); }
    .btn--sm { padding:0.3rem 0.75rem; font-size:0.85rem; } .btn--full { width:100%; justify-content:center; }
    .hamburger { display:none; background:none; border:none; font-size:1.8rem; cursor:pointer; color:var(--color-text); }
    @media (max-width:768px) {
      .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); }
      .main-content { margin-left:0; padding:1.5rem; } .hamburger { display:block; } .grid-cols-2 { grid-template-columns:1fr; }
    }
    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:200; }
    .modal { background:var(--color-card-bg); border-radius:1rem; width:95%; max-width:900px; max-height:90vh; overflow-y:auto; padding:2rem; box-shadow:0 25px 50px rgba(0,0,0,0.2); position:relative; }
    .modal-close { position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--color-text); }
    .tab-nav { display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .tab-btn { padding:0.5rem 1rem; border-radius:0.5rem; border:1px solid var(--color-border); background:transparent; cursor:pointer; font-weight:500; color:var(--color-text-secondary); }
    .tab-btn.active { background:var(--color-purple); color:white; border-color:var(--color-purple); }
    .tab-content { display:none; } .tab-content.active { display:block; }
    .editable-field { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.8rem; }
    .editable-field label { min-width:140px; } .editable-field input, .editable-field textarea, .editable-field select { flex:1; padding:0.5rem; border:1px solid var(--color-border); border-radius:0.5rem; background:var(--color-bg); color:var(--color-text); }
  </style>
</head>
<body>
  <div id="loadingOverlay" style="position:fixed;inset:0;background:var(--color-bg);display:flex;align-items:center;justify-content:center;z-index:9999;gap:1rem;font-size:1.2rem;">
    <i class="fas fa-spinner fa-pulse"></i> Memuat dashboard...
  </div>

  <div class="dashboard-spa" id="dashboardContainer" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand"><span>✦</span> DiptaDigital</div>
      <nav class="sidebar__nav">
        <button class="sidebar__link active" data-section="overview"><i class="fas fa-home"></i> Overview</button>
        <button class="sidebar__link" data-section="websites"><i class="fas fa-globe"></i> Website Saya</button>
        <button class="sidebar__link" data-section="domains"><i class="fas fa-link"></i> Domain Saya</button>
        <button class="sidebar__link" data-section="billing"><i class="fas fa-file-invoice"></i> Invoice</button>
        <button class="sidebar__link" data-section="consultation"><i class="fab fa-whatsapp"></i> Konsultasi</button>
        <button class="sidebar__link" data-section="profile"><i class="fas fa-user"></i> Profil</button>
      </nav>
      <div class="sidebar__footer">
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="btn btn--ghost btn--full" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
      <div class="top-bar">
        <div><h1>Halo, <span id="displayName">User</span></h1><p style="color:var(--color-text-secondary);">Pantau semua project dan aktivitas Anda</p></div>
        <div class="user-badge" style="display:flex; align-items:center; gap:0.8rem; background:var(--color-card-bg); padding:0.5rem 1rem; border-radius:100px; border:1px solid var(--color-border);">
          <div class="avatar" id="avatarInitial" style="width:36px;height:36px;border-radius:50%;background:var(--color-purple);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;">U</div>
          <span id="userEmail">user@email.com</span>
        </div>
      </div>

      <!-- PANELS -->
      <!-- Overview -->
      <div class="section-panel active" id="panel-overview">
        <div class="grid grid-cols-4" id="overviewStats"></div>
        <div class="grid grid-cols-2" style="margin:2rem 0;">
          <div class="stat-card"><h3><i class="fas fa-heartbeat"></i> Status Website</h3><div id="websiteStatusUser"></div></div>
          <div class="stat-card"><h3><i class="fas fa-bolt"></i> Quick Actions</h3><div id="quickActionsUser"></div></div>
        </div>
        <div class="stat-card" style="margin-bottom:2rem;">
          <div style="display:flex; justify-content:space-between; align-items:center;"><h3><i class="fas fa-folder-open"></i> Project Terbaru</h3><button class="btn btn--primary btn--sm" onclick="window.location.href='order.html'"><i class="fas fa-plus"></i> Tambah Project</button></div>
          <div id="recentProjects"></div>
        </div>
        <div class="grid grid-cols-2" style="margin-bottom:2rem;">
          <div class="stat-card"><h3><i class="fas fa-link"></i> Domain Saya</h3><div id="overviewDomains"></div></div>
          <div class="stat-card"><h3><i class="fas fa-chart-bar"></i> Monitoring Server</h3><div id="overviewMonitoring"></div></div>
        </div>
        <div class="stat-card"><h3><i class="fas fa-history"></i> Aktivitas Terbaru</h3><div id="recentActivitiesUser"></div></div>
      </div>

      <!-- Websites -->
      <div class="section-panel" id="panel-websites">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
          <h2>Website Saya</h2>
          <button class="btn btn--primary" onclick="window.location.href='order.html'"><i class="fas fa-plus"></i> Tambah Project</button>
        </div>
        <div id="allProjectsGrid" style="display:grid; gap:1rem; grid-template-columns: repeat(auto-fill, minmax(280px,1fr));"></div>
      </div>

      <!-- Domains -->
      <div class="section-panel" id="panel-domains">
        <h2>Domain Saya</h2>
        <button class="btn btn--primary btn--sm" id="buyDomainBtn" style="margin-bottom:1rem;"><i class="fas fa-plus"></i> Beli Domain Baru</button>
        <div id="domainList"></div>
      </div>

      <!-- Billing -->
      <div class="section-panel" id="panel-billing"><h2>Invoice & Tagihan</h2><div id="invoiceList"></div></div>

      <!-- Consultation -->
      <div class="section-panel" id="panel-consultation">
        <h2>Konsultasi via WhatsApp</h2>
        <form id="consultForm" style="max-width:500px;">
          <div class="form-group"><label>Pilih Website</label><select id="consultWebsite"><option value="">-- Pilih --</option></select></div>
          <div class="form-group"><label>Topik Lain</label><input type="text" id="consultTopic" placeholder="Tulis pertanyaan..."></div>
          <button type="submit" class="btn btn--primary"><i class="fab fa-whatsapp"></i> Kirim via WhatsApp</button>
        </form>
      </div>

      <!-- Profile -->
      <div class="section-panel" id="panel-profile">
        <h2>Profil Saya</h2>
        <form id="profileForm" style="max-width:500px;">
          <div class="form-group"><label>Foto Profil</label><input type="file" id="photoInput" accept="image/*"></div>
          <div class="form-group"><label>Nama</label><input type="text" id="profileName" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="profileEmail" disabled></div>
          <button type="submit" class="btn btn--primary">Simpan</button>
        </form>
      </div>
    </main>
  </div>

  <!-- MODAL DETAIL WEBSITE -->
  <div class="modal-overlay" id="websiteDetailModal" style="display:none;">
    <div class="modal" id="modalContent"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, update, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDX0ZI6LnmijvmVlJgbNXkbudOXaUT6fsM",
      authDomain: "diptadigital-service.firebaseapp.com",
      databaseURL: "https://diptadigital-service-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "diptadigital-service",
      storageBucket: "diptadigital-service.firebasestorage.app",
      messagingSenderId: "411938166244",
      appId: "1:411938166244:web:75f063e07fb95ae2e9e3f1"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // Dark mode
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') { html.setAttribute('data-theme', 'dark'); themeToggle.innerHTML = '<i class="fas fa-sun"></i>'; }
    themeToggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    });

    // Auth
    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('dashboardContainer').style.display = 'flex';
      document.getElementById('displayName').textContent = user.displayName || 'User';
      document.getElementById('avatarInitial').textContent = (user.displayName || 'U')[0];
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('profileName').value = user.displayName || '';
      document.getElementById('profileEmail').value = user.email;
      initDashboard(user);
    });

    function initDashboard(user) {
      // Logout
      document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth).then(() => window.location.href = '../index.html'));

      // Sidebar navigation
      document.querySelectorAll('.sidebar__link').forEach(link => {
        link.addEventListener('click', () => {
          document.querySelectorAll('.sidebar__link').forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
          const panel = document.getElementById('panel-' + link.dataset.section);
          if (panel) panel.classList.add('active');
          document.getElementById('sidebar').classList.remove('open');
        });
      });
      document.getElementById('hamburgerBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

      // Projects listener
      const projectsRef = ref(db, `projects/${user.uid}`);
      let projectsData = {};
      onValue(projectsRef, (snap) => {
        projectsData = snap.val() || {};
        const list = Object.entries(projectsData).map(([id, p]) => ({ id, ...p }));
        updateOverview(list, user);
        updateWebsiteCards(list, user);
        updateConsultSelect(list);
      });

      // Domains listener
      onValue(ref(db, `domains/${user.uid}`), (snap) => {
        const domains = snap.val() || {};
        updateDomains(domains);
      });

      // Invoices listener
      onValue(ref(db, 'invoices'), (snap) => {
        const invs = snap.val() || {};
        const userInvs = Object.entries(invs).filter(([id, inv]) => inv.userId === user.uid);
        updateInvoices(userInvs);
      });

      // Website status (global)
      onValue(ref(db, 'settings/websiteStatus'), (snap) => {
        const status = snap.val() || { online: true, uptime: '99.9%', responseTime: '120ms', ssl: 'valid', lastCheck: new Date().toISOString() };
        document.getElementById('websiteStatusUser').innerHTML = `
          <p>Status: <span class="badge ${status.online ? 'badge-success' : 'badge-danger'}">${status.online ? 'Online' : 'Offline'}</span></p>
          <p>Uptime: ${status.uptime} | Response: ${status.responseTime}</p>
          <p>SSL: ${status.ssl} | Last Check: ${new Date(status.lastCheck).toLocaleTimeString()}</p>`;
      });

      // Monitoring
      onValue(ref(db, 'settings/monitoring'), (snap) => {
        const m = snap.val() || { cpu: 45, ram: 60, storage: 30 };
        document.getElementById('overviewMonitoring').innerHTML = `
          <div style="display:flex; justify-content:space-between;"><span>CPU</span><span>${m.cpu}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${m.cpu}%"></div></div>
          <div style="display:flex; justify-content:space-between;"><span>RAM</span><span>${m.ram}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${m.ram}%"></div></div>
          <div style="display:flex; justify-content:space-between;"><span>Storage</span><span>${m.storage}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${m.storage}%"></div></div>`;
      });

      // Quick actions
      document.getElementById('quickActionsUser').innerHTML = `
        <button class="btn btn--primary btn--sm" style="margin:0.25rem;" onclick="window.location.href='order.html'"><i class="fas fa-plus"></i> Pesan Website</button>
        <button class="btn btn--ghost btn--sm" style="margin:0.25rem;" id="buyDomainAction"><i class="fas fa-link"></i> Beli Domain</button>
        <button class="btn btn--ghost btn--sm" style="margin:0.25rem;" onclick="window.open('https://wa.me/62823641915')"><i class="fab fa-whatsapp"></i> Konsultasi</button>`;
      document.getElementById('buyDomainAction').addEventListener('click', () => {
        const name = prompt('Nama domain (contoh: tokokue.com):');
        if (!name) return;
        const price = prompt('Harga (Rp):', '150000');
        if (!price) return;
        const expiry = new Date();
        expiry.setFullYear(expiry.getFullYear() + 1);
        set(ref(db, `domains/${user.uid}/${name.replace(/\./g, '_')}`), { name, price: parseInt(price), expiry: expiry.toISOString() });
        alert('Domain berhasil dibeli!');
      });

      // Recent activities
      onValue(ref(db, 'activities'), (snap) => {
        const acts = snap.val() || {};
        const sorted = Object.values(acts).sort((a,b) => b.timestamp - a.timestamp).slice(0,5);
        document.getElementById('recentActivitiesUser').innerHTML = sorted.length ? 
          sorted.map(a => `<div style="padding:0.5rem 0; border-bottom:1px solid var(--color-border);">${new Date(a.timestamp).toLocaleString()}: ${a.message}</div>`).join('') :
          '<p style="color:var(--color-text-secondary);">Belum ada aktivitas.</p>';
      });

      // Consultation
      document.getElementById('consultForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const siteId = document.getElementById('consultWebsite').value;
        const topic = document.getElementById('consultTopic').value.trim();
        let msg = `Halo Dipta Digital,\nSaya ingin konsultasi.`;
        if (siteId && projectsData[siteId]) {
          const p = projectsData[siteId];
          msg += `\nTerkait website: ${p.package} ${p.domain ? '· '+p.domain : ''}`;
        }
        if (topic) msg += `\n\nPertanyaan: ${topic}`;
        msg += `\n\nUser ID: ${user.uid}`;
        window.open(`https://wa.me/62823641915?text=${encodeURIComponent(msg)}`, '_blank');
      });

      // Profile
      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newName = document.getElementById('profileName').value.trim();
        const file = document.getElementById('photoInput').files[0];
        if (newName) { await updateProfile(user, { displayName: newName }); await set(ref(db, `users/${user.uid}/name`), newName); }
        if (file) {
          const storRef = sRef(storage, `avatars/${user.uid}`);
          await uploadBytes(storRef, file);
          const url = await getDownloadURL(storRef);
          await updateProfile(user, { photoURL: url });
          await set(ref(db, `users/${user.uid}/photoURL`), url);
        }
        alert('Profil diperbarui');
      });

      // Beli domain button di panel domains
      document.getElementById('buyDomainBtn').addEventListener('click', () => {
        const name = prompt('Nama domain (contoh: tokokue.com):');
        if (!name) return;
        const price = prompt('Harga (Rp):', '150000');
        if (!price) return;
        const expiry = new Date();
        expiry.setFullYear(expiry.getFullYear() + 1);
        set(ref(db, `domains/${user.uid}/${name.replace(/\./g, '_')}`), { name, price: parseInt(price), expiry: expiry.toISOString() });
      });
    }

    // Update Overview
    function updateOverview(list, user) {
      const total = list.length;
      const inProgress = list.filter(p => p.status !== 'completed' && p.status !== 'dp_pending').length;
      const completed = list.filter(p => p.status === 'completed').length;
      const pending = list.filter(p => p.status === 'dp_pending').length;
      document.getElementById('overviewStats').innerHTML = `
        <div class="stat-card"><h3>${total}</h3><p>Total Project</p></div>
        <div class="stat-card"><h3>${inProgress}</h3><p>Dalam Proses</p></div>
        <div class="stat-card"><h3>${completed}</h3><p>Selesai</p></div>
        <div class="stat-card"><h3>${pending}</h3><p>Menunggu DP</p></div>`;

      document.getElementById('recentProjects').innerHTML = list.slice(0,5).map(p => `
        <div style="padding:0.75rem 0; border-bottom:1px solid var(--color-border);">
          <strong>${p.package}</strong> ${p.domain ? '· '+p.domain : ''}
          <span class="badge ${p.status==='completed'?'badge-success':p.status==='dp_pending'?'badge-warning':'badge-info'}">${p.status}</span>
        </div>`).join('') || '<p style="color:var(--color-text-secondary);">Belum ada project.</p>';
    }

    // Update website cards
    function updateWebsiteCards(list, user) {
      const container = document.getElementById('allProjectsGrid');
      container.innerHTML = list.map(p => `
        <div class="stat-card website-card" data-id="${p.id}" style="cursor:pointer;">
          <div style="display:flex; justify-content:space-between;"><h3>${p.package}</h3><span class="badge badge-info">${p.status}</span></div>
          <p style="color:var(--color-text-secondary);">${p.domain || 'Tanpa domain'}</p>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.progress||0}%"></div></div>
          <p style="color:var(--color-text-secondary);">Progress: ${p.progress||0}%</p>
        </div>`).join('') || '<p style="color:var(--color-text-secondary);">Belum ada project.</p>';

      document.querySelectorAll('.website-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          const project = list.find(p => p.id === id);
          if (project) openWebsiteDetail(project, user);
        });
      });
    }

    // Update domains
    function updateDomains(domains) {
      const list = Object.entries(domains).map(([id, d]) => `<div style="padding:0.5rem 0; border-bottom:1px solid var(--color-border);"><strong>${d.name}</strong> - Exp: ${d.expiry ? new Date(d.expiry).toLocaleDateString() : '-'}</div>`).join('');
      document.getElementById('domainList').innerHTML = list || '<p style="color:var(--color-text-secondary);">Belum ada domain.</p>';
      document.getElementById('overviewDomains').innerHTML = list || '<p style="color:var(--color-text-secondary);">Belum ada domain.</p>';
    }

    // Update invoices
    function updateInvoices(invs) {
      document.getElementById('invoiceList').innerHTML = invs.map(([id, inv]) => `
        <div class="stat-card" style="display:flex; justify-content:space-between; align-items:center;">
          <div><strong>#${id}</strong> - ${inv.package}</div>
          <a href="invoice.html?id=${id}" class="btn btn--sm btn--ghost">Lihat</a>
        </div>`).join('') || '<p style="color:var(--color-text-secondary);">Tidak ada tagihan.</p>';
    }

    // Update consultation select
    function updateConsultSelect(list) {
      const sel = document.getElementById('consultWebsite');
      sel.innerHTML = '<option value="">-- Pilih --</option>' + list.map(p => `<option value="${p.id}">${p.package} ${p.domain ? '· '+p.domain : ''}</option>`).join('');
    }

    // ====== MODAL DETAIL WEBSITE ======
    function openWebsiteDetail(project, user) {
      const modal = document.getElementById('websiteDetailModal');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <button class="modal-close" onclick="document.getElementById('websiteDetailModal').style.display='none'">&times;</button>
        <h2>${project.package} — Detail</h2>
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="tab-overview">Overview</button>
          <button class="tab-btn" data-tab="tab-settings">Settings</button>
          <button class="tab-btn" data-tab="tab-deploy">Deploy</button>
          <button class="tab-btn" data-tab="tab-logs">Logs</button>
          <button class="tab-btn" data-tab="tab-monitoring">Monitoring</button>
          <button class="tab-btn" data-tab="tab-backup">Backup</button>
          <button class="tab-btn" data-tab="tab-errors">Errors</button>
        </div>
        <div id="tab-overview" class="tab-content active"></div>
        <div id="tab-settings" class="tab-content"></div>
        <div id="tab-deploy" class="tab-content"></div>
        <div id="tab-logs" class="tab-content"></div>
        <div id="tab-monitoring" class="tab-content"></div>
        <div id="tab-backup" class="tab-content"></div>
        <div id="tab-errors" class="tab-content"></div>
      `;
      modal.style.display = 'flex';

      // Tab switching
      content.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          content.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          content.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          const target = content.querySelector('#' + btn.dataset.tab);
          if (target) target.classList.add('active');
        });
      });

      // Overview tab (pakai data project dan global status)
      const overviewTab = content.querySelector('#tab-overview');
      onValue(ref(db, 'settings/websiteStatus'), (snap) => {
        const s = snap.val() || { online: true, uptime: '99.9%', responseTime: '120ms', ssl: 'valid', lastCheck: new Date().toISOString() };
        overviewTab.innerHTML = `
          <div class="grid grid-cols-2">
            <div><strong>Status:</strong> <span class="badge ${s.online ? 'badge-success' : 'badge-danger'}">${s.online ? 'Online' : 'Offline'}</span></div>
            <div><strong>Uptime:</strong> ${s.uptime}</div>
            <div><strong>Response Time:</strong> ${s.responseTime}</div>
            <div><strong>SSL:</strong> ${s.ssl}</div>
            <div><strong>Domain Status:</strong> ${project.domain ? 'Active' : 'N/A'}</div>
            <div><strong>Last Health Check:</strong> ${new Date(s.lastCheck).toLocaleString()}</div>
            <div><strong>Total Visitors:</strong> ${project.visitors || 0}</div>
            <div><strong>Visitors Today:</strong> ${project.visitorsToday || 0}</div>
            <div><strong>Visitors This Month:</strong> ${project.visitorsMonth || 0}</div>
            <div><strong>Total Users:</strong> ${project.totalUsers || 0}</div>
            <div><strong>Active Users:</strong> ${project.activeUsers || 0}</div>
            <div><strong>New Users:</strong> ${project.newUsers || 0}</div>
            <div><strong>Total Orders:</strong> ${project.totalOrders || 0}</div>
            <div><strong>Total Products:</strong> ${project.totalProducts || 0}</div>
            <div><strong>Total Revenue:</strong> Rp ${(project.revenue || 0).toLocaleString()}</div>
          </div>`;
      });

      // Settings tab
      const settingsTab = content.querySelector('#tab-settings');
      settingsTab.innerHTML = `
        <div class="editable-field"><label>Website Name:</label><input type="text" id="editName" value="${project.businessName || ''}"></div>
        <div class="editable-field"><label>Description:</label><textarea id="editDesc">${project.description || ''}</textarea></div>
        <div class="editable-field"><label>Logo URL:</label><input type="text" id="editLogo" value="${project.logo || ''}"></div>
        <div class="editable-field"><label>Version:</label><input type="text" id="editVersion" value="${project.version || '1.0.0'}"></div>
        <div class="editable-field"><label>Domain:</label><input type="text" id="editDomain" value="${project.domain || ''}"></div>
        <div class="editable-field"><label>Maintenance Mode:</label>
          <select id="editMaintenance">
            <option value="false" ${project.maintenance ? '' : 'selected'}>Off</option>
            <option value="true" ${project.maintenance ? 'selected' : ''}>On</option>
          </select></div>
        <button class="btn btn--primary" id="saveSettingsBtn">Simpan Perubahan</button>
      `;
      document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
        const updates = {
          businessName: document.getElementById('editName').value,
          description: document.getElementById('editDesc').value,
          logo: document.getElementById('editLogo').value,
          version: document.getElementById('editVersion').value,
          domain: document.getElementById('editDomain').value,
          maintenance: document.getElementById('editMaintenance').value === 'true'
        };
        await update(ref(db, `projects/${user.uid}/${project.id}`), updates);
        alert('Pengaturan disimpan');
        modal.style.display = 'none';
      });

      // Deploy tab
      const deployTab = content.querySelector('#tab-deploy');
      onValue(ref(db, 'settings/deploy'), (snap) => {
        const d = snap.val() || { version: '1.0.0', branch: 'main', environment: 'production', lastDeploy: new Date().toISOString(), status: 'success' };
        deployTab.innerHTML = `
          <p><strong>Current Version:</strong> ${d.version}</p>
          <p><strong>Active Branch:</strong> ${d.branch}</p>
          <p><strong>Environment:</strong> ${d.environment}</p>
          <p><strong>Last Deploy:</strong> ${new Date(d.lastDeploy).toLocaleString()}</p>
          <p><strong>Status:</strong> <span class="badge ${d.status==='success' ? 'badge-success' : 'badge-danger'}">${d.status}</span></p>`;
      });

      // Logs tab
      const logsTab = content.querySelector('#tab-logs');
      onValue(ref(db, 'deployLogs'), (snap) => {
        const logs = snap.val() || {};
        const sorted = Object.values(logs).sort((a,b) => b.timestamp - a.timestamp).slice(0,15);
        logsTab.innerHTML = '<h4>Deploy & Build Logs</h4>' + sorted.map(l => `<div style="padding:0.3rem 0; border-bottom:1px solid var(--color-border);">${new Date(l.timestamp).toLocaleString()}: ${l.message}</div>`).join('') +
          '<button class="btn btn--ghost btn--sm" style="margin-top:0.5rem;" onclick="navigator.clipboard.writeText(JSON.stringify(sorted))">Copy Logs</button>';
      });

      // Monitoring tab
      const monitoringTab = content.querySelector('#tab-monitoring');
      onValue(ref(db, 'settings/monitoring'), (snap) => {
        const m = snap.val() || { cpu: 45, ram: 60, storage: 30 };
        monitoringTab.innerHTML = `
          <div style="display:flex; justify-content:space-between;"><span>CPU</span><span>${m.cpu}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${m.cpu}%"></div></div>
          <div style="display:flex; justify-content:space-between;"><span>RAM</span><span>${m.ram}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${m.ram}%"></div></div>
          <div style="display:flex; justify-content:space-between;"><span>Storage</span><span>${m.storage}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${m.storage}%"></div></div>`;
      });

      // Backup tab
      const backupTab = content.querySelector('#tab-backup');
      onValue(ref(db, 'settings/backup'), (snap) => {
        const b = snap.val() || { lastBackup: new Date().toISOString(), size: '150MB', status: 'success' };
        backupTab.innerHTML = `
          <p><strong>Last Backup:</strong> ${new Date(b.lastBackup).toLocaleString()}</p>
          <p><strong>Size:</strong> ${b.size}</p>
          <p><strong>Status:</strong> <span class="badge badge-success">${b.status}</span></p>
          <button class="btn btn--primary btn--sm" id="createBackupBtn">Create Backup</button>
          <button class="btn btn--ghost btn--sm" id="restoreBackupBtn">Restore Backup</button>
        `;
        document.getElementById('createBackupBtn')?.addEventListener('click', () => alert('Backup created (simulasi)'));
        document.getElementById('restoreBackupBtn')?.addEventListener('click', () => alert('Restore berhasil (simulasi)'));
      });

      // Errors tab
      const errorsTab = content.querySelector('#tab-errors');
      onValue(ref(db, 'errorLogs'), (snap) => {
        const errs = snap.val() || {};
        errorsTab.innerHTML = Object.values(errs).map(e => `
          <div style="padding:0.3rem 0; border-bottom:1px solid var(--color-border);">
            <span class="badge ${e.resolved ? 'badge-success' : 'badge-danger'}">${e.resolved ? 'Resolved' : 'Unresolved'}</span>
            ${e.message} <small>${new Date(e.timestamp).toLocaleString()}</small>
          </div>`).join('') || '<p>Tidak ada error.</p>';
      });
    }

    // Tutup modal klik luar
    document.getElementById('websiteDetailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('websiteDetailModal')) {
        document.getElementById('websiteDetailModal').style.display = 'none';
      }
    });
  </script>
</body>
</html>
